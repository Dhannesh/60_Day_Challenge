<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Compass — University</title>
<style>
  :root{
    --bg-0:#0b0e14;
    --bg-1:#12161f;
    --panel:#161b26;
    --panel-2:#1c2230;
    --line:#252c3d;
    --ink:#e8ecf4;
    --ink-dim:#8891a7;
    --gold:#d9a441;
    --gold-soft:#f0cf7f;
    --c-faculty:#5b8cff;
    --c-depthead:#c46bd9;
    --c-advisor:#3fbf8f;
    --c-registrar:#e0a83e;
    --c-it:#4fc3d9;
    --c-affairs:#e0637b;
    --c-exam:#9fd15a;
    --radius:18px;
    --shadow: 0 20px 50px -20px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;
    background:
      radial-gradient(1200px 700px at 15% -10%, #1a2138 0%, transparent 60%),
      radial-gradient(1000px 600px at 100% 0%, #1e1730 0%, transparent 55%),
      var(--bg-0);
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
  }
  .sans{font-family:'Avenir Next','Segoe UI',system-ui,sans-serif;}
  #app{max-width:1000px;margin:0 auto;padding:28px 20px 80px;}

  /* ---------- header ---------- */
  header.top{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    text-align:center;margin-bottom:28px;
  }
  .compass-badge{
    width:56px;height:56px;border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold), #7a5220, var(--gold));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 3px rgba(217,164,65,.15), 0 10px 30px -10px rgba(217,164,65,.5);
    font-size:24px;margin-bottom:6px;
    animation:spin-slow 18s linear infinite;
  }
  @keyframes spin-slow{to{transform:rotate(360deg);}}
  h1{font-size:2.1rem;margin:0;letter-spacing:.5px;font-weight:600;}
  .subtitle{color:var(--ink-dim);font-size:1rem;margin:0;font-style:italic;}
  .campus-tag{
    font-family:'Avenir Next','Segoe UI',sans-serif;
    font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--gold-soft);opacity:.85;margin-top:4px;
  }

  /* ---------- progress ---------- */
  .progress-wrap{margin:18px auto 30px;max-width:640px;}
  .progress-stages{display:flex;justify-content:space-between;margin-bottom:8px;
    font-family:'Avenir Next',sans-serif;font-size:.75rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.08em;}
  .progress-stages span.active{color:var(--gold-soft);font-weight:700;}
  .progress-track{height:6px;border-radius:6px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line);}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-soft));
    transition:width .6s cubic-bezier(.4,0,.2,1);border-radius:6px;}

  /* ---------- panel/card shell ---------- */
  .panel{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:28px;
    position:relative;
    overflow:hidden;
    animation:fadeUp .5s ease both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .panel::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(500px 200px at 100% 0%, rgba(217,164,65,.06), transparent 60%);
  }

  .eyebrow{
    font-family:'Avenir Next',sans-serif;font-size:.72rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--gold-soft);margin-bottom:6px;font-weight:700;
  }
  .task-title{font-size:1.35rem;line-height:1.4;margin:0 0 4px;}
  .task-sub{color:var(--ink-dim);font-size:.92rem;margin:0 0 22px;font-family:'Avenir Next',sans-serif;}

  .ticket{
    background:var(--bg-1);
    border:1px dashed rgba(217,164,65,.4);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:24px;
    position:relative;
  }
  .ticket::before{
    content:'📋 TICKET';
    font-family:'Avenir Next',sans-serif;font-size:.65rem;letter-spacing:.15em;
    color:var(--gold-soft);opacity:.7;display:block;margin-bottom:8px;font-weight:700;
  }
  .ticket p{margin:0;font-size:1.05rem;line-height:1.5;}

  /* ---------- role cards ---------- */
  .role-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .role-card{
    font-family:'Avenir Next',sans-serif;
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 12px;
    text-align:center;
    cursor:grab;
    user-select:none;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    position:relative;
  }
  .role-card:hover{transform:translateY(-4px);box-shadow:0 10px 24px -8px rgba(0,0,0,.5);}
  .role-card:active{cursor:grabbing;}
  .role-card.dragging{opacity:.35;}
  .role-card .icon{font-size:1.6rem;display:block;margin-bottom:6px;}
  .role-card .name{font-size:.85rem;font-weight:600;color:var(--ink);}
  .role-card.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,164,65,.35);}
  .role-card.placed{opacity:.3;pointer-events:none;}

  .role-card[data-role="Faculty"]{border-top:3px solid var(--c-faculty);}
  .role-card[data-role="Department Head"]{border-top:3px solid var(--c-depthead);}
  .role-card[data-role="Academic Advisor"]{border-top:3px solid var(--c-advisor);}
  .role-card[data-role="Registrar"]{border-top:3px solid var(--c-registrar);}
  .role-card[data-role="IT Support"]{border-top:3px solid var(--c-it);}
  .role-card[data-role="Student Affairs"]{border-top:3px solid var(--c-affairs);}
  .role-card[data-role="Exam Cell"]{border-top:3px solid var(--c-exam);}

  /* stage1 drop slot */
  .drop-zone{
    border:2px dashed var(--gold);
    border-radius:14px;
    padding:22px;
    text-align:center;
    font-family:'Avenir Next',sans-serif;
    color:var(--ink-dim);
    margin-bottom:20px;
    transition:background .2s ease, border-color .2s ease;
    min-height:70px;
    display:flex;align-items:center;justify-content:center;
    font-size:.95rem;
  }
  .drop-zone.dragover{background:rgba(217,164,65,.12);border-color:var(--gold-soft);}
  .drop-zone.filled{border-style:solid;color:var(--ink);font-weight:700;font-size:1.05rem;background:rgba(217,164,65,.08);}

  /* stage2 sequence slots */
  .sequence-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px;}
  .seq-slot{
    flex:1 1 120px;min-width:120px;height:64px;
    border:2px dashed var(--line);border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Avenir Next',sans-serif;font-size:.75rem;color:var(--ink-dim);
    position:relative;transition:border-color .2s ease, background .2s ease;
  }
  .seq-slot.dragover{border-color:var(--gold-soft);background:rgba(217,164,65,.1);}
  .seq-slot .step-num{position:absolute;top:-9px;left:8px;background:var(--bg-1);
    padding:0 6px;font-size:.65rem;color:var(--gold-soft);font-weight:700;}
  .seq-slot.filled{border-style:solid;border-color:var(--gold);}
  .seq-arrow{color:var(--gold-soft);font-size:1.2rem;}

  /* stage3 multi select */
  .role-card.multi-selected{border-color:var(--gold-soft);background:rgba(217,164,65,.12);}
  .multi-counter{font-family:'Avenir Next',sans-serif;font-size:.8rem;color:var(--ink-dim);margin-bottom:14px;}

  /* buttons */
  .btn{
    font-family:'Avenir Next',sans-serif;
    background:linear-gradient(180deg, var(--gold-soft), var(--gold));
    color:#20140a;border:none;border-radius:12px;
    padding:13px 26px;font-size:.95rem;font-weight:700;cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(217,164,65,.5);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px -8px rgba(217,164,65,.65);}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.ghost{
    background:transparent;border:1px solid var(--line);color:var(--ink);
    box-shadow:none;
  }
  .btn.ghost:hover{border-color:var(--gold);color:var(--gold-soft);}
  .btn-row{display:flex;justify-content:flex-end;gap:12px;margin-top:6px;}

  /* feedback panel */
  .feedback{
    margin-top:20px;padding:20px;border-radius:14px;
    background:var(--bg-1);border:1px solid rgba(217,164,65,.35);
    animation:fadeUp .4s ease both;
  }
  .feedback h4{margin:0 0 10px;color:var(--gold-soft);font-size:1.05rem;font-family:'Avenir Next',sans-serif;}
  .feedback p{margin:6px 0;line-height:1.55;font-size:.95rem;}
  .feedback .tag{display:inline-block;font-family:'Avenir Next',sans-serif;font-size:.7rem;
    background:rgba(217,164,65,.15);color:var(--gold-soft);padding:3px 10px;border-radius:20px;margin-right:6px;margin-bottom:6px;font-weight:700;letter-spacing:.03em;}

  /* animated route (stage2 reveal) */
  .route-anim{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 0;font-family:'Avenir Next',sans-serif;}
  .route-chip{
    padding:8px 14px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);
    font-size:.8rem;font-weight:700;opacity:0;transform:translateX(-10px);
    animation:chipIn .4s ease forwards;
  }
  @keyframes chipIn{to{opacity:1;transform:translateX(0);}}

  /* radar chart */
  .results-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:10px;}
  @media (max-width:640px){.results-grid{grid-template-columns:1fr;}}
  .score-bars{display:flex;flex-direction:column;gap:14px;font-family:'Avenir Next',sans-serif;}
  .score-row .label{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:5px;color:var(--ink-dim);}
  .score-track{height:10px;border-radius:6px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line);}
  .score-fill{height:100%;border-radius:6px;width:0%;transition:width 1.2s cubic-bezier(.4,0,.2,1);}

  .reflect-block{margin-top:26px;}
  .reflect-item{
    background:var(--bg-1);border-left:3px solid var(--gold);border-radius:10px;
    padding:14px 18px;margin-bottom:12px;font-size:.95rem;line-height:1.55;
  }
  .reflect-item .rtag{font-family:'Avenir Next',sans-serif;font-size:.68rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--gold-soft);font-weight:700;display:block;margin-bottom:4px;}

  .celebration{
    position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;
  }
  .confetti{
    position:absolute;top:-20px;width:8px;height:14px;opacity:.9;
    animation:fall linear forwards;
  }
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0;}}

  .stage-num-chip{
    display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:50%;background:var(--gold);
    color:#20140a;font-weight:800;font-size:.8rem;margin-right:8px;font-family:'Avenir Next',sans-serif;
  }

  ::selection{background:rgba(217,164,65,.3);}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div class="compass-badge">🧭</div>
    <h1>Task Compass</h1>
    <p class="subtitle">Learn how work flows through real organizations.</p>
    <span class="campus-tag">Campus Edition · School / University</span>
  </header>

  <div class="progress-wrap">
    <div class="progress-stages">
      <span id="ps-1">1 · Who Owns This?</span>
      <span id="ps-2">2 · Task Routing</span>
      <span id="ps-3">3 · Collaboration</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div id="stageContainer"></div>
</div>

<div class="celebration" id="celebration"></div>

<script>
/* =========================================================
   DATA
========================================================= */
const ROLES = [
  {id:"Faculty", icon:"🎓", desc:"Teaches courses, sets grades, designs curriculum content."},
  {id:"Department Head", icon:"🏛️", desc:"Oversees a department, approves policy and staffing decisions."},
  {id:"Academic Advisor", icon:"🧭", desc:"Guides students on course selection, majors, and academic planning."},
  {id:"Registrar", icon:"📚", desc:"Manages official records, transcripts, enrollment and scheduling."},
  {id:"IT Support", icon:"💻", desc:"Maintains campus systems, networks, and digital infrastructure."},
  {id:"Student Affairs", icon:"🤝", desc:"Supports student wellbeing, conduct, and campus life."},
  {id:"Exam Cell", icon:"📝", desc:"Runs examinations, grading logistics, and result verification."}
];

const STAGE1_TASKS = [
  {
    title:"A student notices their transcript shows the wrong final grade for a course.",
    correct:"Registrar",
    why:"The Registrar owns the official academic record. Transcripts are their document, even though the grade itself may have originated with a professor.",
    assist:["Faculty","Exam Cell"]
  },
  {
    title:"The library's wifi keeps disconnecting the week before final exams.",
    correct:"IT Support",
    why:"IT Support owns campus network infrastructure. A connectivity failure is a systems issue, not an academic one, regardless of when it happens.",
    assist:["Student Affairs"]
  },
  {
    title:"A second-year student wants to switch their declared major before the semester ends.",
    correct:"Academic Advisor",
    why:"Academic Advisors own the student's academic pathway and are the first point of contact for planning changes like this.",
    assist:["Department Head","Registrar"]
  },
  {
    title:"A professor has missed several lectures in a row without notice.",
    correct:"Department Head",
    why:"Staffing accountability and coverage for a faculty member sits with the Department Head, who manages that person's responsibilities.",
    assist:["Faculty","Student Affairs"]
  },
  {
    title:"A student wants to formally appeal a failing grade they believe was unfair.",
    correct:"Faculty",
    why:"The instructor who assigned the grade is the first owner of any grade dispute — they can clarify, review, or correct their own evaluation.",
    assist:["Department Head","Exam Cell"]
  },
  {
    title:"A new elective course syllabus is ready and needs formal sign-off.",
    correct:"Department Head",
    why:"Curriculum approval within a department is the Department Head's responsibility, ensuring it fits academic standards and staffing capacity.",
    assist:["Faculty"]
  },
  {
    title:"A student confides that they are overwhelmed and struggling emotionally.",
    correct:"Student Affairs",
    why:"Student wellbeing and mental health support is core to Student Affairs' role, who can connect the student to the right resources.",
    assist:["Academic Advisor"]
  },
  {
    title:"A classroom projector stops working in the middle of a lecture.",
    correct:"IT Support",
    why:"Equipment and technical failures in classrooms fall to IT Support, who maintain and repair campus hardware.",
    assist:["Faculty"]
  },
  {
    title:"Two students were accidentally issued the same student ID number.",
    correct:"Registrar",
    why:"Student identity records and ID issuance are owned by the Registrar, who maintains the master enrollment database.",
    assist:["IT Support"]
  }
];

const STAGE2_TASKS = [
  {
    title:"A student wants to formally dispute their final exam grade.",
    steps:["Faculty","Department Head","Exam Cell","Registrar"],
    why:"The instructor reviews the grade first, the Department Head oversees the appeal process, the Exam Cell verifies scoring records, and the Registrar finalizes any correction to the official transcript."
  },
  {
    title:"A new elective course needs to be added for next semester.",
    steps:["Faculty","Department Head","Registrar"],
    why:"Faculty design the course, the Department Head approves it academically, and the Registrar schedules it into the official course catalog and timetable."
  },
  {
    title:"A technical failure disrupts an online examination for hundreds of students.",
    steps:["IT Support","Exam Cell","Department Head","Student Affairs"],
    why:"IT Support fixes the immediate technical issue, the Exam Cell decides how to handle affected results, the Department Head signs off on any policy exception, and Student Affairs communicates support options to affected students."
  }
];

const STAGE3_TASKS = [
  {
    title:"Student dropout rates suddenly increase across multiple departments.",
    primary:"Student Affairs",
    correctSet:["Student Affairs","Academic Advisor","Department Head","Registrar"],
    why:"This pattern usually reflects overlapping causes — wellbeing, academic fit, departmental pressures, and enrollment trends — so no single office can diagnose or fix it alone.",
    flow:"Student Affairs gathers wellbeing signals → Academic Advisors report advising trends → Department Heads review course-level pressures → Registrar supplies enrollment data to confirm the pattern."
  },
  {
    title:"The university receives negative press coverage about student safety on campus.",
    primary:"Department Head",
    correctSet:["Department Head","Student Affairs","IT Support","Registrar"],
    why:"A safety story touches academic leadership, student welfare response, official communications online, and any record-keeping tied to the incident — a coordinated response protects trust better than one office acting alone.",
    flow:"Department Head coordinates institutional response → Student Affairs supports affected students → IT Support manages official website/communications → Registrar confirms any enrollment or record implications."
  },
  {
    title:"Enrollment numbers unexpectedly spike for the next semester.",
    primary:"Registrar",
    correctSet:["Registrar","Academic Advisor","Department Head","IT Support"],
    why:"A sudden enrollment surge is a records, advising, capacity, and systems challenge all at once — each office needs to adapt for the change to go smoothly.",
    flow:"Registrar manages official enrollment intake → Academic Advisors prepare for higher advising demand → Department Heads assess classroom/staffing capacity → IT Support ensures systems can handle the load."
  }
];

/* =========================================================
   STATE
========================================================= */
let stage = 1;
let s1Index = 0, s2Index = 0, s3Index = 0;
let scores = {ownership:0, delegation:0, collaboration:0, workflow:0};
let s1MaxPerQ = 3, s2MaxPerQ = 3, s3MaxPerQ = 4;
let insights = {overAssigned:0, underCollaborated:0, goodCalls:0};

const container = document.getElementById("stageContainer");
const progressFill = document.getElementById("progressFill");

function updateProgress(){
  const totalSteps = 9;
  let done = 0;
  if(stage===1) done = s1Index;
  if(stage===2) done = 3 + s2Index;
  if(stage===3) done = 6 + s3Index;
  progressFill.style.width = Math.min(100,(done/totalSteps)*100) + "%";
  document.getElementById("ps-1").className = stage===1?"active":"";
  document.getElementById("ps-2").className = stage===2?"active":"";
  document.getElementById("ps-3").className = stage===3?"active":"";
}

/* =========================================================
   STAGE 1 — Who Owns This?
========================================================= */
function renderStage1(){
  updateProgress();
  if(s1Index >= 3){ stage = 2; s2Index = 0; renderStage2(); return; }
  const task = STAGE1_TASKS[s1Index];

  container.innerHTML = `
    <div class="panel">
      <div class="eyebrow"><span class="stage-num-chip">1</span>Who Owns This? — Question ${s1Index+1} of 3</div>
      <h2 class="task-title">Drag the role that should own this task.</h2>
      <p class="task-sub">Drop one role card into the ownership slot below.</p>
      <div class="ticket"><p>${task.title}</p></div>
      <div class="drop-zone" id="dropZone">Drop the owning role here</div>
      <div class="role-grid" id="roleGrid"></div>
      <div id="feedbackArea"></div>
      <div class="btn-row"><button class="btn" id="nextBtn" disabled>Continue →</button></div>
    </div>
  `;

  const grid = document.getElementById("roleGrid");
  ROLES.forEach(r=>{
    const card = document.createElement("div");
    card.className = "role-card";
    card.draggable = true;
    card.dataset.role = r.id;
    card.innerHTML = `<span class="icon">${r.icon}</span><span class="name">${r.id}</span>`;
    card.addEventListener("dragstart", e=>{
      e.dataTransfer.setData("text/plain", r.id);
      card.classList.add("dragging");
    });
    card.addEventListener("dragend", ()=> card.classList.remove("dragging"));
    card.addEventListener("click", ()=> handleStage1Submit(r.id, task)); // tap support
    grid.appendChild(card);
  });

  const dz = document.getElementById("dropZone");
  dz.addEventListener("dragover", e=>{ e.preventDefault(); dz.classList.add("dragover"); });
  dz.addEventListener("dragleave", ()=> dz.classList.remove("dragover"));
  dz.addEventListener("drop", e=>{
    e.preventDefault();
    dz.classList.remove("dragover");
    const role = e.dataTransfer.getData("text/plain");
    if(role) handleStage1Submit(role, task);
  });
}

let s1Answered = false;
function handleStage1Submit(role, task){
  if(s1Answered) return;
  s1Answered = true;
  const dz = document.getElementById("dropZone");
  dz.classList.add("filled");
  dz.textContent = role + " assigned as owner";

  document.querySelectorAll(".role-card").forEach(c=>{
    if(c.dataset.role===role) c.classList.add("placed");
  });

  const isCorrect = role === task.correct;
  if(isCorrect) scores.ownership += 1; else insights.overAssigned += (task.assist.includes(role)?0:1);

  const fb = document.getElementById("feedbackArea");
  fb.innerHTML = `
    <div class="feedback">
      <h4>${isCorrect ? "✓ Primary Owner: " + task.correct : "Actual Primary Owner: " + task.correct}</h4>
      <p>${task.why}</p>
      <p><strong>May assist:</strong> ${task.assist.map(a=>`<span class="tag">${a}</span>`).join("")}</p>
      ${!isCorrect ? `<p style="color:var(--ink-dim);font-size:.85rem;">You chose <strong>${role}</strong> — worth considering why ${task.correct} is closer to the true owner here.</p>` : ""}
    </div>
  `;
  document.getElementById("nextBtn").disabled = false;
  document.getElementById("nextBtn").onclick = ()=>{
    s1Answered = false;
    s1Index++;
    renderStage1();
  };
}

/* =========================================================
   STAGE 2 — Task Routing
========================================================= */
function renderStage2(){
  updateProgress();
  if(s2Index >= 3){ stage = 3; s3Index = 0; renderStage3(); return; }
  const task = STAGE2_TASKS[s2Index];
  const n = task.steps.length;

  container.innerHTML = `
    <div class="panel">
      <div class="eyebrow"><span class="stage-num-chip">2</span>Task Routing — Question ${s2Index+1} of 3</div>
      <h2 class="task-title">Build the workflow in the correct order.</h2>
      <p class="task-sub">Drag role cards into the numbered slots, left to right.</p>
      <div class="ticket"><p>${task.title}</p></div>
      <div class="sequence-row" id="sequenceRow"></div>
      <div class="role-grid" id="roleGrid2"></div>
      <div id="feedbackArea2"></div>
      <div class="btn-row">
        <button class="btn ghost" id="resetBtn2">Reset</button>
        <button class="btn" id="checkBtn2" disabled>Submit Route</button>
      </div>
    </div>
  `;

  const seqRow = document.getElementById("sequenceRow");
  let slotFills = new Array(n).fill(null);

  function renderSlots(){
    seqRow.innerHTML = "";
    for(let i=0;i<n;i++){
      const slot = document.createElement("div");
      slot.className = "seq-slot" + (slotFills[i] ? " filled" : "");
      slot.dataset.index = i;
      slot.innerHTML = `<span class="step-num">Step ${i+1}</span>${slotFills[i] ? roleLabel(slotFills[i]) : "Drop role"}`;
      slot.addEventListener("dragover", e=>{ e.preventDefault(); slot.classList.add("dragover"); });
      slot.addEventListener("dragleave", ()=> slot.classList.remove("dragover"));
      slot.addEventListener("drop", e=>{
        e.preventDefault();
        slot.classList.remove("dragover");
        const role = e.dataTransfer.getData("text/plain");
        if(role && !slotFills.includes(role)){
          slotFills[i] = role;
          renderSlots();
          renderRoleGrid2();
          checkComplete();
        }
      });
      slot.addEventListener("click", ()=>{
        if(slotFills[i]){ slotFills[i]=null; renderSlots(); renderRoleGrid2(); checkComplete(); }
      });
      seqRow.appendChild(slot);
      if(i < n-1){
        const arrow = document.createElement("span");
        arrow.className = "seq-arrow";
        arrow.textContent = "→";
        seqRow.appendChild(arrow);
      }
    }
  }
  function roleLabel(id){
    const r = ROLES.find(x=>x.id===id);
    return `${r.icon} ${r.id}`;
  }
  function renderRoleGrid2(){
    const grid = document.getElementById("roleGrid2");
    grid.innerHTML = "";
    ROLES.forEach(r=>{
      const card = document.createElement("div");
      card.className = "role-card" + (slotFills.includes(r.id) ? " placed" : "");
      card.draggable = !slotFills.includes(r.id);
      card.dataset.role = r.id;
      card.innerHTML = `<span class="icon">${r.icon}</span><span class="name">${r.id}</span>`;
      card.addEventListener("dragstart", e=>{
        e.dataTransfer.setData("text/plain", r.id);
        card.classList.add("dragging");
      });
      card.addEventListener("dragend", ()=> card.classList.remove("dragging"));
      card.addEventListener("click", ()=>{
        if(slotFills.includes(r.id)) return;
        const emptyIdx = slotFills.findIndex(s=>s===null);
        if(emptyIdx !== -1){ slotFills[emptyIdx] = r.id; renderSlots(); renderRoleGrid2(); checkComplete(); }
      });
      grid.appendChild(card);
    });
  }
  function checkComplete(){
    document.getElementById("checkBtn2").disabled = slotFills.includes(null);
  }

  renderSlots();
  renderRoleGrid2();

  document.getElementById("resetBtn2").onclick = ()=>{
    slotFills = new Array(n).fill(null);
    renderSlots(); renderRoleGrid2(); checkComplete();
  };

  document.getElementById("checkBtn2").onclick = ()=>{
    const isExact = JSON.stringify(slotFills) === JSON.stringify(task.steps);
    const correctSetMatch = slotFills.every(r=>task.steps.includes(r));
    if(isExact) scores.workflow += 1;
    if(correctSetMatch) scores.delegation += 0.5;

    const fb = document.getElementById("feedbackArea2");
    fb.innerHTML = `
      <div class="feedback">
        <h4>${isExact ? "✓ That matches the common routing" : "Here's how this typically routes"}</h4>
        <div class="route-anim" id="routeAnim"></div>
        <p>${task.why}</p>
        ${!isExact ? `<p style="color:var(--ink-dim);font-size:.85rem;">Your order was: ${slotFills.map(roleLabel).join(" → ")}</p>` : ""}
      </div>
    `;
    const anim = document.getElementById("routeAnim");
    task.steps.forEach((r,i)=>{
      const chip = document.createElement("span");
      chip.className = "route-chip";
      chip.style.animationDelay = (i*0.25)+"s";
      chip.textContent = roleLabel(r);
      anim.appendChild(chip);
      if(i < task.steps.length-1){
        const arrow = document.createElement("span");
        arrow.className = "seq-arrow";
        arrow.style.opacity = 0;
        arrow.style.animation = `chipIn .4s ease forwards`;
        arrow.style.animationDelay = (i*0.25+0.1)+"s";
        arrow.textContent = "→";
        anim.appendChild(arrow);
      }
    });

    document.getElementById("checkBtn2").disabled = true;
    document.getElementById("resetBtn2").outerHTML = `<button class="btn" id="nextBtn2">Continue →</button>`;
    document.getElementById("nextBtn2").onclick = ()=>{
      s2Index++;
      renderStage2();
    };
  };
}

/* =========================================================
   STAGE 3 — Collaboration Challenge
========================================================= */
function renderStage3(){
  updateProgress();
  if(s3Index >= 3){ stage = 4; renderResults(); return; }
  const task = STAGE3_TASKS[s3Index];
  let selected = [];

  container.innerHTML = `
    <div class="panel">
      <div class="eyebrow"><span class="stage-num-chip">3</span>Collaboration Challenge — Question ${s3Index+1} of 3</div>
      <h2 class="task-title">Assign up to four roles who should be involved.</h2>
      <p class="task-sub">Tap cards to select. Think about who needs to collaborate, not just one owner.</p>
      <div class="ticket"><p>${task.title}</p></div>
      <div class="multi-counter" id="multiCounter">0 of 4 selected</div>
      <div class="role-grid" id="roleGrid3"></div>
      <div id="feedbackArea3"></div>
      <div class="btn-row"><button class="btn" id="submitBtn3" disabled>Submit Response</button></div>
    </div>
  `;

  const grid = document.getElementById("roleGrid3");
  ROLES.forEach(r=>{
    const card = document.createElement("div");
    card.className = "role-card";
    card.dataset.role = r.id;
    card.innerHTML = `<span class="icon">${r.icon}</span><span class="name">${r.id}</span>`;
    card.addEventListener("click", ()=>{
      if(card.classList.contains("multi-selected")){
        card.classList.remove("multi-selected");
        selected = selected.filter(x=>x!==r.id);
      } else {
        if(selected.length >= 4) return;
        card.classList.add("multi-selected");
        selected.push(r.id);
      }
      document.getElementById("multiCounter").textContent = `${selected.length} of 4 selected`;
      document.getElementById("submitBtn3").disabled = selected.length === 0;
    });
    grid.appendChild(card);
  });

  document.getElementById("submitBtn3").onclick = ()=>{
    const matched = selected.filter(s=>task.correctSet.includes(s));
    const collabScore = matched.length / task.correctSet.length;
    scores.collaboration += collabScore;
    if(selected.includes(task.primary)) scores.ownership += 0.3;
    scores.delegation += (selected.length>1 ? 0.5 : 0);
    if(selected.length <= 1) insights.underCollaborated += 1;
    if(matched.length === task.correctSet.length) insights.goodCalls += 1;

    document.querySelectorAll("#roleGrid3 .role-card").forEach(c=>c.style.pointerEvents="none");

    const fb = document.getElementById("feedbackArea3");
    fb.innerHTML = `
      <div class="feedback">
        <h4>✓ Primary Owner: ${task.primary}</h4>
        <p><strong>Supporting teams typically involved:</strong> ${task.correctSet.map(a=>`<span class="tag">${a}</span>`).join("")}</p>
        <p>${task.why}</p>
        <p><strong>Possible communication flow:</strong> ${task.flow}</p>
      </div>
    `;
    document.getElementById("submitBtn3").outerHTML = `<button class="btn" id="nextBtn3">Continue →</button>`;
    document.getElementById("nextBtn3").onclick = ()=>{
      s3Index++;
      renderStage3();
    };
  };
}

/* =========================================================
   RESULTS
========================================================= */
function renderResults(){
  updateProgress();
  progressFill.style.width = "100%";

  const maxScores = {ownership:3.3, delegation:2.5, collaboration:3, workflow:3};
  const pct = {
    ownership: Math.min(100, Math.round((scores.ownership/maxScores.ownership)*100)),
    delegation: Math.min(100, Math.round((scores.delegation/maxScores.delegation)*100)),
    collaboration: Math.min(100, Math.round((scores.collaboration/maxScores.collaboration)*100)),
    workflow: Math.min(100, Math.round((scores.workflow/maxScores.workflow)*100))
  };

  container.innerHTML = `
    <div class="panel">
      <div class="eyebrow">🎉 Simulation Complete</div>
      <h2 class="task-title">How you understand this university's workflows</h2>
      <p class="task-sub">Not a score — a map of your organizational instincts.</p>

      <div class="results-grid">
        <div class="score-bars" id="scoreBars"></div>
        <svg id="radar" viewBox="0 0 220 220" width="100%" height="220"></svg>
      </div>

      <div class="reflect-block" id="reflectBlock"></div>
      <div class="btn-row"><button class="btn ghost" id="restartBtn">Run Simulation Again</button></div>
    </div>
  `;

  const bars = document.getElementById("scoreBars");
  const catInfo = [
    ["ownership","Ownership", "#5b8cff"],
    ["delegation","Delegation", "#c46bd9"],
    ["collaboration","Collaboration", "#3fbf8f"],
    ["workflow","Workflow Thinking", "#e0a83e"]
  ];
  catInfo.forEach(([key,label,color])=>{
    const row = document.createElement("div");
    row.className = "score-row";
    row.innerHTML = `
      <div class="label"><span>${label}</span><span>${pct[key]}%</span></div>
      <div class="score-track"><div class="score-fill" style="background:${color}" data-pct="${pct[key]}"></div></div>
    `;
    bars.appendChild(row);
  });
  setTimeout(()=>{
    document.querySelectorAll(".score-fill").forEach(f=>{
      f.style.width = f.dataset.pct + "%";
    });
  }, 100);

  drawRadar(pct);

  const reflect = document.getElementById("reflectBlock");
  const strongCats = catInfo.filter(([k])=>pct[k]>=65).map(([,l])=>l);
  const weakCats = catInfo.filter(([k])=>pct[k]<50).map(([,l])=>l);

  let understood = strongCats.length
    ? `You showed a solid instinct for ${strongCats.join(" and ")}, recognizing ownership and structure quickly across the scenarios.`
    : `Your instincts were fairly balanced across categories, without one area clearly leading the others.`;

  let overAssignNote = insights.overAssigned > 0
    ? `In a few cases you assigned ownership to a role that could assist but wasn't the primary owner — a common instinct when a task touches many people.`
    : `You generally avoided over-assigning ownership to roles that were only meant to assist, which suggests a clear read on where responsibility actually sits.`;

  let underCollabNote = insights.underCollaborated > 0
    ? `In at least one collaboration challenge, you selected very few roles — worth noticing, since complex problems in organizations rarely have just one owner.`
    : `You tended to bring in multiple roles for complex problems, which reflects how these situations usually play out in real organizations.`;

  reflect.innerHTML = `
    <div class="reflect-item">
      <span class="rtag">What you understood well</span>
      ${understood}
    </div>
    <div class="reflect-item">
      <span class="rtag">Where you tended to over-assign responsibility</span>
      ${overAssignNote}
    </div>
    <div class="reflect-item">
      <span class="rtag">Where you underestimated collaboration</span>
      ${underCollabNote}
    </div>
    <div class="reflect-item">
      <span class="rtag">One insight about how organizations work</span>
      Many real workplace problems — especially in universities — are solved by several offices working together, not by any single department acting alone.
    </div>
  `;

  document.getElementById("restartBtn").onclick = ()=>{
    stage = 1; s1Index=0; s2Index=0; s3Index=0;
    scores = {ownership:0, delegation:0, collaboration:0, workflow:0};
    insights = {overAssigned:0, underCollaborated:0, goodCalls:0};
    renderStage1();
  };

  launchConfetti();
}

function drawRadar(pct){
  const svg = document.getElementById("radar");
  const cx=110, cy=110, r=85;
  const cats = ["ownership","delegation","collaboration","workflow"];
  const labels = ["Ownership","Delegation","Collaboration","Workflow"];
  const angleStep = (Math.PI*2)/cats.length;

  let svgContent = "";
  // grid rings
  for(let ring=1; ring<=4; ring++){
    const rr = (r/4)*ring;
    let pts = "";
    for(let i=0;i<cats.length;i++){
      const a = -Math.PI/2 + i*angleStep;
      pts += (cx+rr*Math.cos(a)) + "," + (cy+rr*Math.sin(a)) + " ";
    }
    svgContent += `<polygon points="${pts}" fill="none" stroke="#252c3d" stroke-width="1"/>`;
  }
  // axes + labels
  for(let i=0;i<cats.length;i++){
    const a = -Math.PI/2 + i*angleStep;
    const x2 = cx+r*Math.cos(a), y2 = cy+r*Math.sin(a);
    svgContent += `<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="#252c3d" stroke-width="1"/>`;
    const lx = cx+(r+18)*Math.cos(a), ly = cy+(r+18)*Math.sin(a);
    svgContent += `<text x="${lx}" y="${ly}" fill="#8891a7" font-size="9" font-family="sans-serif" text-anchor="middle">${labels[i]}</text>`;
  }
  // data polygon
  let dataPts = "";
  cats.forEach((c,i)=>{
    const a = -Math.PI/2 + i*angleStep;
    const val = (pct[c]/100)*r;
    dataPts += (cx+val*Math.cos(a)) + "," + (cy+val*Math.sin(a)) + " ";
  });
  svgContent += `<polygon points="${dataPts}" fill="rgba(217,164,65,.3)" stroke="#d9a441" stroke-width="2"/>`;

  svg.innerHTML = svgContent;
}

function launchConfetti(){
  const celeb = document.getElementById("celebration");
  const colors = ["#d9a441","#5b8cff","#c46bd9","#3fbf8f","#e0637b"];
  for(let i=0;i<40;i++){
    const el = document.createElement("div");
    el.className = "confetti";
    el.style.left = Math.random()*100 + "vw";
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (2.5+Math.random()*2)+"s";
    el.style.animationDelay = (Math.random()*0.5)+"s";
    celeb.appendChild(el);
    setTimeout(()=> el.remove(), 5000);
  }
}

/* =========================================================
   INIT
========================================================= */
renderStage1();
</script>
