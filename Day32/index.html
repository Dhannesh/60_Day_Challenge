          const ta = document.createElement("textarea");
          ta.value = prompt;
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");

          document.body.removeChild(ta);
          setCopied(true);
          setTimeout(() => setCopied(false), 1600);
        };
        return (
          <div className="ask-card fade-in">
            <div className="ask-head">🧠 How to ask Claude</div>
            <div className="ask-prompt">{prompt}</div>
            <button className="btn btn-secondary copy-btn" onClick={doCopy}>
              {copied ? "Copied ✓" : "Copy prompt"}

          </div>
        );

      /* ---------------------------------------------------------------
   STEP 4: PLATFORM SELECTION
--------------------------------------------------------------- */

      function getFit(brand, platform, mode) {
        const weight =
          mode === "personal"
            ? ["linkedin", "twitter", "youtube", "newsletter"]
            : [];
        let score = 0;
        const tags = brand.tags || [];
        platform.idealTags.forEach((t) => {
          if (tags.includes(t)) score += 1;
        });
        if (weight.includes(platform.id)) score += 1.5;
        if (score >= 1.5) return { verdict: "Strong fit", cls: "tag-good" };
        if (score >= 0.75) return { verdict: "Possible fit", cls: "tag-mid" };
        return { verdict: "Not ideal", cls: "tag-bad" };
      }

      function PlatformStep({
        brand,
        mode,
        chosen,
        setChosen,
        onNext,
        onBack,
      }) {
        const toggle = (id) => {
          setChosen((prev) =>
            prev.includes(id) ? prev.filter((p) => p !== id) : [...prev, id],
          );
        };
        return (
          <div className="fade-in">
            <Eyebrow>Step 4 · Choose your platforms</Eyebrow>
            <h1 className="pagetitle">
              Where should this brand actually show up?

                  Newsletters usually carry more weight — they reward individual

                  brand-driven platforms do.

                const fit = getFit(brand, p, mode);
                const isChosen = chosen.includes(p.id);
                return (
                  <button
                    key={p.id}
                    className={"choice-card" + (isChosen ? " selected" : "")}
                    onClick={() => toggle(p.id)}
                  >
                    <div className="choice-title">
                      {p.icon} {p.label}
                    </div>
                    <div className="choice-desc">{p.blurb}</div>
                    <span className={"tag " + fit.cls}>{fit.verdict}</span>

                fontSize: 12.5,
                color: "var(--ink-faint)",

              }
            />
            <NavButtons
              onBack={onBack}
              onNext={onNext}
              nextDisabled={chosen.length === 0}
            />
          </div>
        );
      }

--------------------------------------------------------------- */

      function PillarStep({ mode, chosen, setChosen, onNext, onBack }) {
        const pillars =
          mode === "personal" ? PILLARS_PERSONAL : PILLARS_BUSINESS;
        const toggle = (id) => {
          setChosen((prev) => {
            if (prev.includes(id)) return prev.filter((p) => p !== id);
            if (prev.length >= 3) return prev;
            return [...prev, id];
          });
        };
        return (
          <div className="fade-in">
            <Eyebrow>Step 5 · Pick your content pillars</Eyebrow>
            <h1 className="pagetitle">Choose exactly 3 content pillars</h1>
            <ExplainBlock
              what="Content pillars are the recurring themes a brand posts about — the categories every individual post falls under."
              why="Picking too many pillars makes a brand feel scattered. Three focused pillars are enough to stay interesting while still being consistent and recognizable."
            />
            <div className="grid grid-2">
              {pillars.map((p) => {
                const isChosen = chosen.includes(p.id);
                const disabled = !isChosen && chosen.length >= 3;
                return (
                  <button
                    key={p.id}
                    className={
                      "choice-card" +
                      (isChosen ? " selected" : "") +
                      (disabled ? " disabled" : "")
                    }
                    onClick={() => !disabled && toggle(p.id)}
                    disabled={disabled}
                  >
                    <div className="choice-title">{p.label}</div>
                    <div className="choice-desc">{p.desc}</div>
                    <div
                      className="choice-desc"
                      style={{ marginTop: 8, color: "var(--teal)" }}
                    >
                      → {p.goal}
                    </div>
                  </button>
                );
              })}
            </div>
            <p
              style={{
                fontSize: 12.5,
                color: "var(--ink-faint)",
                marginTop: 10,
              }}
            >
              Selected {chosen.length} / 3
            </p>
            <AskClaudeCard
              prompt={
                mode === "personal"
                  ? `I've chosen these 3 content pillars for my personal brand in [your niche]: [pillar 1, pillar 2, pillar 3]. Give me 3 post ideas for each pillar that fit my niche.`
                  : `My business [business name] has chosen these 3 content pillars: [pillar 1, pillar 2, pillar 3]. Give me 3 post ideas for each pillar suited to our audience.`
              }
            />
            <NavButtons
              onBack={onBack}
              onNext={onNext}
              nextDisabled={chosen.length !== 3}
            />
          </div>
        );
      }

      /* ---------------------------------------------------------------
   STEP 6: 30-DAY ROADMAP
--------------------------------------------------------------- */

      function buildRoadmap(mode, brand, platforms, pillars, pillarDefs) {
        const pillarNames = pillars.map(
          (id) => pillarDefs.find((p) => p.id === id).label,
        );
        const platNames = platforms.map(
          (id) => PLATFORMS.find((p) => p.id === id).label,
        );

        if (mode === "personal") {
          return [
            {
              title: "Week 1 — Define your point of view",
              body: `Nail down your niche in one sentence and rewrite your bio/profile on ${platNames[0] || "your main platform"} around it. Everything you post from here on should make that positioning clearer, not blurrier.`,
            },
            {
              title: "Week 2 — Establish your pillars",
              body: `Start publishing consistently across your 3 pillars (${pillarNames.join(", ")}). Goal isn't virality yet — it's proving to yourself and early followers that you show up reliably.`,
            },
            {
              title: "Week 3 — Start engaging outward",
              body: `Spend as much time commenting and replying in your niche as posting. Growth on ${platNames.join(" and ") || "your platforms"} compounds faster when people see you show up in other people's comments too.`,
            },
            {
              title: "Week 4 — Double down on what worked",
              body: `Look back at which of your 3 pillars got the most genuine engagement (not just views) and shift slightly more effort there for the next cycle.`,
            },
          ];
        }
        return [
          {
            title: "Week 1 — Foundations & awareness",
            body: `Set up or clean up profiles on ${platNames.join(" and ") || "chosen platforms"}, and start publishing your first pillar content. Goal: make sure people encountering ${brand.name || "the brand"} for the first time immediately understand what it is.`,
          },
          {
            title: "Week 2 — Build the content rhythm",
            body: `Establish a repeatable cadence across your 3 pillars (${pillarNames.join(", ")}). Consistency matters more than volume this week.`,
          },
          {
            title: "Week 3 — Lean into trust",
            body: `Prioritize whichever pillar builds the most trust fastest (proof, education, or story) to convert early attention into real interest.`,
          },
          {
            title: "Week 4 — Push toward conversion",
            body: `With awareness and trust building, introduce a clear call to action — without abandoning the pillars that got people here in the first place.`,
          },
        ];
      }

      function RoadmapStep({
        mode,
        brand,
        platforms,
        pillars,
        onNext,
        onBack,
      }) {
        const pillarDefs =
          mode === "personal" ? PILLARS_PERSONAL : PILLARS_BUSINESS;
        const roadmap = useMemo(
          () => buildRoadmap(mode, brand, platforms, pillars, pillarDefs),
          [mode, brand, platforms, pillars],
        );
        return (
          <div className="fade-in">
            <Eyebrow>Step 6 · Plan the month</Eyebrow>
            <h1 className="pagetitle">Your 30-day roadmap</h1>
            <ExplainBlock
              what="A roadmap sets weekly goals and strategic focus — not individual posts. It's the 'why this week matters' layer above the content calendar."
              why="Without a roadmap, content becomes reactive and repetitive. With one, every week builds on the last instead of starting from zero."
            />
            <div className="card">
              {roadmap.map((w, i) => (
                <div className="week-card" key={i}>
                  <div className="week-title">{w.title}</div>
                  <div className="week-body">{w.body}</div>
                </div>
              ))}
            </div>
            <AskClaudeCard
              prompt={
                mode === "personal"
                  ? `Based on my niche [your niche] and content pillars [pillar 1, pillar 2, pillar 3], turn Week 2 of my roadmap into 5 specific post ideas, one per weekday.`
                  : `Based on ${brand.name || "[business]"}'s content pillars [pillar 1, pillar 2, pillar 3], turn Week 2 of the roadmap into 5 specific post ideas, one per weekday.`
              }
            />
            <NavButtons onBack={onBack} onNext={onNext} />
          </div>
        );
      }

      /* ---------------------------------------------------------------
   STEP 7: UNEXPECTED EVENT
--------------------------------------------------------------- */

      function EventStep({ mode, event, choice, setChoice, onNext, onBack }) {
        return (
          <div className="fade-in">
            <Eyebrow>Step 7 · Something unexpected happens</Eyebrow>
            <h1 className="pagetitle">{event.title}</h1>
            <ExplainBlock
              what="Real marketing rarely goes exactly to plan. Strategists constantly react to unplanned moments — good and bad — without abandoning the overall strategy."
              why="How you respond to an unexpected moment often matters more for growth than the roadmap itself. This is the skill that separates reactive posting from strategic thinking."
            />
            <div className="card">
              <p style={{ color: "var(--ink-dim)", marginTop: 0 }}>
                {event.detail}
              </p>
              <div className="grid" style={{ gap: 10, marginTop: 10 }}>
                {event.options.map((opt) => (
                  <button
                    key={opt.id}
                    className={
                      "choice-card" + (choice === opt.id ? " selected" : "")
                    }
                    onClick={() => setChoice(opt.id)}
                  >
                    <div
                      className="choice-desc"
                      style={{ fontSize: 14, color: "var(--ink)" }}
                    >
                      {opt.label}
                    </div>
                  </button>
                ))}
              </div>
              {choice && (
                <div className="stat-box fade-in" style={{ marginTop: 14 }}>
                  <div className="stat-label">📈 Consequence</div>
                  <div
                    className="stat-value"
                    style={{
                      fontWeight: 400,
                      fontSize: 13.5,
                      color: "var(--ink-dim)",
                    }}
                  >
                    {event.options.find((o) => o.id === choice).consequence}
                  </div>
                </div>
              )}
            </div>
            <AskClaudeCard
              prompt={
                mode === "personal"
                  ? `Something unexpected just happened to my personal brand: [describe the event]. I'm considering responding by [your planned response]. What are the risks and upsides of that approach?`
                  : `Something unexpected just happened to my business's marketing: [describe the event]. I'm considering responding by [your planned response]. What are the risks and upsides of that approach?`
              }
            />
            <NavButtons
              onBack={onBack}
              onNext={onNext}
              nextDisabled={!choice}
              nextLabel="See Growth Report →"
            />
          </div>
        );
      }

      /* ---------------------------------------------------------------
   STEP 8: GROWTH REPORT
--------------------------------------------------------------- */

      function GrowthReport({
        mode,
        brand,
        platforms,
        pillars,
        event,
        choice,
        onRestart,
      }) {
        const pillarDefs =
          mode === "personal" ? PILLARS_PERSONAL : PILLARS_BUSINESS;
        const pillarNames = pillars.map(
          (id) => pillarDefs.find((p) => p.id === id).label,
        );
        const platNames = platforms.map(
          (id) => PLATFORMS.find((p) => p.id === id).label,
        );
        const chosenOption = event.options.find((o) => o.id === choice);
        const otherOption = event.options.find((o) => o.id !== choice);

        const lessonsPool =
          mode === "personal" ? LESSONS_PERSONAL : LESSONS_BUSINESS;
        const shuffledLessons = useMemo(() => {
          const arr = [...lessonsPool];
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr.slice(0, 2);
        }, []);
        const dynamicLesson = chosenOption.good
          ? "Your response to the unexpected moment reinforced your strategy instead of undermining it — that instinct matters as much as the plan itself."
          : "The unexpected moment revealed a gap between your plan and your instincts under pressure — worth noticing before the next one happens.";

        let score = 40;
        score += platforms.length * 6;
        score += pillars.length * 6;
        score += chosenOption.good ? 14 : 4;
        score = Math.min(96, score);

        return (
          <div className="fade-in">
            <Eyebrow>Final Step · Growth Report</Eyebrow>
            <h1 className="pagetitle">
              {mode === "personal" ? `${brand.name}'s` : brand.name} Growth
              Report
            </h1>
            <p className="subtitle">
              Here's how your strategic decisions came together over this
              simulation.
            </p>

            <div className="card" style={{ marginBottom: 16 }}>
              <div className="row-between">
                <div>
                  <div className="stat-label">GROWTH POTENTIAL SCORE</div>
                  <div
                    style={{
                      fontSize: 13,
                      color: "var(--ink-dim)",
                      maxWidth: 420,
                      marginTop: 4,
                    }}
                  >
                    Based on platform focus, pillar clarity, and how you handled
                    the unexpected event.
                  </div>
                </div>
                <div className="badge-score" style={{ "--pct": score }}>
                  <div className="badge-inner">{score}</div>
                </div>
              </div>
            </div>

            <div className="grid grid-2">
              <div className="stat-box">
                <div className="stat-label">🎯 Audience Understanding</div>
                <div
                  className="stat-value"
                  style={{
                    fontWeight: 400,
                    fontSize: 13.5,
                    color: "var(--ink-dim)",
                  }}
                >
                  {mode === "personal"
                    ? `You defined your audience as people slightly earlier on the path you've already walked in ${brand.niche || "your niche"} — a strong, specific starting point.`
                    : `You defined the audience around ${brand.audience}, giving your content a specific person to write for instead of "everyone."`}
                </div>
              </div>
              <div className="stat-box">
                <div className="stat-label">📱 Platform Strategy</div>
                <div
                  className="stat-value"
                  style={{
                    fontWeight: 400,
                    fontSize: 13.5,
                    color: "var(--ink-dim)",
                  }}
                >
                  Focused on:{" "}
                  <span style={{ color: "var(--ink)" }}>
                    {platNames.join(", ")}
                  </span>
                  .
                  {platforms.length > 3
                    ? " Consider narrowing further next time — fewer platforms, done consistently, usually outperform being everywhere."
                    : " A focused spread that should be sustainable to post to consistently."}
                </div>
              </div>
              <div className="stat-box">
                <div className="stat-label">🗂️ Content Strategy</div>
                <div
                  className="stat-value"
                  style={{
                    fontWeight: 400,
                    fontSize: 13.5,
                    color: "var(--ink-dim)",
                  }}
                >
                  Three pillars:{" "}
                  <span style={{ color: "var(--ink)" }}>
                    {pillarNames.join(", ")}
                  </span>{" "}
                  — giving the content variety while staying recognizable.
                </div>
              </div>
              <div className="stat-box">
                <div className="stat-label">📊 Growth Potential</div>
                <div
                  className="stat-value"
                  style={{
                    fontWeight: 400,
                    fontSize: 13.5,
                    color: "var(--ink-dim)",
                  }}
                >
                  {score >= 80
                    ? "High — the platform focus, pillar clarity, and event response all reinforced each other."
                    : score >= 60
                      ? "Moderate — solid foundations, with room to sharpen focus in one area."
                      : "Early stage — the foundation is there, but focus needs tightening before scaling effort."}
                </div>
              </div>
            </div>

            <div className="grid grid-2" style={{ marginTop: 14 }}>
              <div className="stat-box">
                <div className="stat-label">✅ Best Decision</div>
                <div
                  className="stat-value"
                  style={{
                    fontWeight: 400,
                    fontSize: 13.5,
                    color: "var(--ink-dim)",
                  }}
                >
                  {chosenOption.good
                    ? `Choosing to "${chosenOption.label.toLowerCase()}" when facing "${event.title.toLowerCase()}" — this response reinforced your overall strategy.`
                    : `Committing to a focused set of ${pillars.length} content pillars instead of trying to cover everything.`}
                </div>
              </div>
              <div className="stat-box">
                <div className="stat-label">
                  ⚠️ Biggest Mistake (risk to watch)
                </div>
                <div
                  className="stat-value"
                  style={{
                    fontWeight: 400,
                    fontSize: 13.5,
                    color: "var(--ink-dim)",
                  }}
                >
                  {!chosenOption.good
                    ? `Choosing to "${chosenOption.label.toLowerCase()}" during "${event.title.toLowerCase()}" — the safer alternative was "${otherOption.label.toLowerCase()}."`
                    : platforms.length > 3
                      ? "Spreading across more platforms than a small budget/time investment can sustain consistently."
                      : "No major missteps this round — the main risk now is losing consistency after the initial push."}
                </div>
              </div>
            </div>

            <div className="card" style={{ marginTop: 16 }}>
              <div className="stat-label" style={{ marginBottom: 10 }}>
                🎓 Three Marketing Lessons From This Round
              </div>
              <ol
                style={{
                  margin: 0,
                  paddingLeft: 20,
                  color: "var(--ink-dim)",
                  fontSize: 13.8,
                  lineHeight: 1.8,
                }}
              >
                <li>{dynamicLesson}</li>
                {shuffledLessons.map((l, i) => (
                  <li key={i}>{l}</li>
                ))}
              </ol>
            </div>

            <AskClaudeCard
              prompt={
                mode === "personal"
                  ? `Here's my personal brand strategy: niche is [your niche], platforms are [platform list], content pillars are [pillar list]. Review this like a marketing strategist and tell me the single biggest risk in this plan.`
                  : `Here's my brand strategy for ${brand.name || "[business]"}: audience is [audience], platforms are [platform list], content pillars are [pillar list]. Review this like a marketing strategist and tell me the single biggest risk in this plan.`
              }
            />

            <div className="row-between" style={{ marginTop: 24 }}>
              <span style={{ fontSize: 12.5, color: "var(--ink-faint)" }}>
                Simulation complete.
              </span>
              <button className="btn btn-primary" onClick={onRestart}>
                🔁 Run a new simulation
              </button>
            </div>
          </div>
        );
      }

      /* ---------------------------------------------------------------
   ROOT APP
--------------------------------------------------------------- */

      const STEP_LABELS = [
        "Welcome",
        "Choose Brand",
        "Know the Brand",
        "Audience",
        "Platforms",
        "Content Pillars",
        "Roadmap",
        "Unexpected Event",
        "Growth Report",
      ];

      function App() {
        const [step, setStep] = useState(0);
        const [mode, setMode] = useState(null);
        const [brand, setBrand] = useState(null);
        const [platforms, setPlatforms] = useState([]);
        const [pillars, setPillars] = useState([]);
        const [event] = useState(
          () => EVENTS[Math.floor(Math.random() * EVENTS.length)],
        );
        const [eventChoice, setEventChoice] = useState(null);

        const restart = () => {
          setStep(0);
          setMode(null);
          setBrand(null);
          setPlatforms([]);
          setPillars([]);
          setEventChoice(null);
          window.location.reload();
        };

        const goto = (n) => {
          setStep(n);
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

        return (
          <div className="app">
            {step > 0 && step < 8 && (
              <ProgressBar
                stepIndex={step}
                totalSteps={9}
                label={STEP_LABELS[step]}
              />
            )}

            {step === 0 && <Welcome onStart={() => goto(1)} />}

            {step === 1 && (
              <PathSelect
                onChoose={(m) => {
                  setMode(m);
                  goto(2);
                }}
              />
            )}

            {step === 2 && (
              <ProfileStep
                mode={mode}
                onDone={(b) => {
                  setBrand(b);
                  goto(3);
                }}
              />
            )}

            {step === 3 && brand && (
              <AudienceStep
                brand={brand}
                mode={mode}
                onBack={() => goto(2)}
                onNext={() => goto(4)}
              />
            )}

            {step === 4 && brand && (
              <PlatformStep
                brand={brand}
                mode={mode}
                chosen={platforms}
                setChosen={setPlatforms}
                onBack={() => goto(3)}
                onNext={() => goto(5)}
              />
            )}

            {step === 5 && (
              <PillarStep
                mode={mode}
                chosen={pillars}
                setChosen={setPillars}
                onBack={() => goto(4)}
                onNext={() => goto(6)}
              />
            )}

            {step === 6 && brand && (
              <RoadmapStep
                mode={mode}
                brand={brand}
                platforms={platforms}
                pillars={pillars}
                onBack={() => goto(5)}
                onNext={() => goto(7)}
              />
            )}

            {step === 7 && (
              <EventStep
                mode={mode}
                event={event}
                choice={eventChoice}
                setChoice={setEventChoice}
                onBack={() => goto(6)}
                onNext={() => goto(8)}
              />
            )}

            {step === 8 && brand && (
              <GrowthReport
                mode={mode}
                brand={brand}
                platforms={platforms}
                pillars={pillars}
                event={event}
                choice={eventChoice}
                onRestart={restart}
              />
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
