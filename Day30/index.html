<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Supply Chain Builder</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        --bg-base: #0a0e1a;
        --bg-card: #111827;
        --bg-card2: #151d2e;
        --bg-hover: #1a2540;
        --border: #1e2d4a;
        --accent: #3b82f6;
        --accent2: #6366f1;
        --accent-glow: rgba(59, 130, 246, 0.18);
        --green: #10b981;
        --yellow: #f59e0b;
        --red: #ef4444;
        --purple: #8b5cf6;
        --cyan: #06b6d4;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
        --text-muted: #475569;
        --radius: 14px;
        --radius-sm: 8px;
        --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: var(--bg-base);
        color: var(--text-primary);
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        min-height: 100vh;
        line-height: 1.6;
      }
      #root {
        min-height: 100vh;
      }

      /* Layout */
      .app-wrapper {
        max-width: 900px;
        margin: 0 auto;
        padding: 24px 16px 60px;
      }

      /* Header */
      .app-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }
      .header-icon {
        width: 38px;
        height: 38px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        flex-shrink: 0;
      }
      .header-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.3px;
      }
      .header-sub {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 1px;
      }

      /* Cards */
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        margin-bottom: 18px;
        transition: border-color var(--transition);
      }
      .card:hover {
        border-color: #2a3f6a;
      }
      .card-sm {
        padding: 16px;
      }

      /* Metrics bar */
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        margin-bottom: 18px;
      }
      @media (max-width: 640px) {
        .metrics-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .metric-card {
        background: var(--bg-card2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 12px;
        text-align: center;
        transition: all var(--transition);
      }
      .metric-card:hover {
        background: var(--bg-hover);
      }
      .metric-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        margin-bottom: 6px;
      }
      .metric-value {
        font-size: 22px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .metric-bar-track {
        height: 4px;
        background: #1e2d4a;
        border-radius: 99px;
        margin-top: 8px;
        overflow: hidden;
      }
      .metric-bar-fill {
        height: 100%;
        border-radius: 99px;
        transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Step progress */
      .step-progress {
        display: flex;
        align-items: center;
        gap: 0;
        margin-bottom: 22px;
      }
      .step-dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        border: 2px solid var(--border);
        background: var(--bg-card2);
        color: var(--text-muted);
        transition: all var(--transition);
        flex-shrink: 0;
        position: relative;
        z-index: 1;
      }
      .step-dot.active {
        border-color: var(--accent);
        background: var(--accent-glow);
        color: var(--accent);
      }
      .step-dot.done {
        border-color: var(--green);
        background: rgba(16, 185, 129, 0.15);
        color: var(--green);
      }
      .step-line {
        flex: 1;
        height: 2px;
        background: var(--border);
        transition: background var(--transition);
      }
      .step-line.done {
        background: var(--green);
      }

      /* Choice options */
      .choices-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 16px;
      }
      @media (max-width: 500px) {
        .choices-grid {
          grid-template-columns: 1fr;
        }
      }
      .choice-card {
        background: var(--bg-card2);
        border: 2px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        cursor: pointer;
        transition: all var(--transition);
        text-align: left;
      }
      .choice-card:hover {
        border-color: var(--accent);
        background: var(--bg-hover);
        transform: translateY(-2px);
      }
      .choice-card.selected {
        border-color: var(--accent);
        background: var(--accent-glow);
      }
      .choice-title {
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .choice-icon {
        font-size: 20px;
      }
      .choice-desc {
        font-size: 12px;
        color: var(--text-secondary);
        line-height: 1.5;
      }
      .choice-tags {
        display: flex;
        gap: 6px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .tag {
        font-size: 10px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 99px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .tag-green {
        background: rgba(16, 185, 129, 0.15);
        color: var(--green);
      }
      .tag-red {
        background: rgba(239, 68, 68, 0.15);
        color: var(--red);
      }
      .tag-yellow {
        background: rgba(245, 158, 11, 0.15);
        color: var(--yellow);
      }
      .tag-blue {
        background: rgba(59, 130, 246, 0.15);
        color: var(--accent);
      }
      .tag-purple {
        background: rgba(139, 92, 246, 0.15);
        color: var(--purple);
      }

      /* Concept box */
      .concept-box {
        background: linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.08),
          rgba(99, 102, 241, 0.08)
        );
        border: 1px solid rgba(59, 130, 246, 0.25);
        border-radius: var(--radius-sm);
        padding: 16px;
        margin-bottom: 18px;
      }
      .concept-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 8px;
      }
      .concept-title {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .concept-body {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.7;
      }

      /* Tradeoff box */
      .tradeoff-box {
        background: rgba(245, 158, 11, 0.07);
        border: 1px solid rgba(245, 158, 11, 0.2);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        margin-top: 14px;
        font-size: 13px;
        color: #fcd34d;
        line-height: 1.6;
      }
      .tradeoff-box strong {
        color: var(--yellow);
      }

      /* Company card */
      .company-header {
        display: flex;
        align-items: center;
        gap: 16px;
        background: linear-gradient(135deg, #0f172a, #1a2540);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        margin-bottom: 18px;
      }
      .company-logo {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        flex-shrink: 0;
      }
      .company-name {
        font-size: 18px;
        font-weight: 800;
      }
      .company-meta {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 2px;
      }
      .company-pills {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .pill {
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 99px;
        background: var(--bg-card2);
        border: 1px solid var(--border);
        color: var(--text-secondary);
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 11px 22px;
        border-radius: var(--radius-sm);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all var(--transition);
        letter-spacing: 0.1px;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
      }
      .btn-primary:hover {
        opacity: 0.92;
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      }
      .btn-secondary {
        background: var(--bg-card2);
        border: 1px solid var(--border);
        color: var(--text-primary);
      }
      .btn-secondary:hover {
        background: var(--bg-hover);
        border-color: #2a3f6a;
      }
      .btn-green {
        background: linear-gradient(135deg, #059669, #10b981);
        color: #fff;
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
      }
      .btn-green:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none !important;
      }

      /* Section headings */
      .section-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-sub {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 16px;
      }

      /* Dashboard */
      .score-ring-wrapper {
        text-align: center;
        margin: 12px 0 28px;
      }
      .score-big {
        font-size: 64px;
        font-weight: 900;
        line-height: 1;
        letter-spacing: -2px;
      }
      .score-label {
        font-size: 13px;
        color: var(--text-secondary);
        margin-top: 4px;
      }
      .score-ring-track {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        margin: 0 auto 12px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dash-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      @media (max-width: 500px) {
        .dash-grid {
          grid-template-columns: 1fr;
        }
      }
      .dash-block {
        background: var(--bg-card2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 16px;
      }
      .dash-block-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text-muted);
        font-weight: 700;
        margin-bottom: 10px;
      }
      .dash-list {
        list-style: none;
      }
      .dash-list li {
        font-size: 13px;
        color: var(--text-secondary);
        padding: 4px 0;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .dash-list li::before {
        content: "";
        display: block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-top: 6px;
        flex-shrink: 0;
      }
      .dash-list.green li::before {
        background: var(--green);
      }
      .dash-list.red li::before {
        background: var(--red);
      }
      .dash-list.blue li::before {
        background: var(--accent);
      }
      .improvement-item {
        background: var(--bg-card2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        margin-bottom: 10px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
      }
      .improvement-num {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 800;
        flex-shrink: 0;
        color: #fff;
      }
      .improvement-text {
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.6;
      }

      /* Welcome */
      .welcome-hero {
        text-align: center;
        padding: 40px 20px 32px;
      }
      .welcome-emoji {
        font-size: 52px;
        margin-bottom: 16px;
      }
      .welcome-title {
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -1px;
        margin-bottom: 10px;
      }
      .welcome-title span {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .welcome-body {
        font-size: 15px;
        color: var(--text-secondary);
        max-width: 520px;
        margin: 0 auto 28px;
        line-height: 1.75;
      }
      .features-row {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin-bottom: 32px;
      }
      .feature-chip {
        background: var(--bg-card2);
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 7px 14px;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--text-secondary);
      }
      .chain-visual {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        flex-wrap: wrap;
        margin-bottom: 32px;
      }
      .chain-node {
        background: var(--bg-card2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 10px 14px;
        font-size: 12px;
        text-align: center;
        min-width: 80px;
      }
      .chain-node-icon {
        font-size: 20px;
        margin-bottom: 4px;
      }
      .chain-node-label {
        color: var(--text-muted);
        font-size: 10px;
      }
      .chain-arrow {
        color: var(--text-muted);
        font-size: 16px;
      }

      /* Fade animation */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-up {
        animation: fadeUp 0.35s ease both;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #1e2d4a;
        border-radius: 99px;
      }

      /* Risk highlight */
      .risk-callout {
        background: rgba(239, 68, 68, 0.08);
        border: 1px solid rgba(239, 68, 68, 0.25);
        border-radius: var(--radius-sm);
        padding: 14px 16px;
        display: flex;
        gap: 12px;
        align-items: flex-start;
      }
      .risk-callout-icon {
        font-size: 20px;
        flex-shrink: 0;
      }
      .risk-callout-body {
        font-size: 13px;
        color: #fca5a5;
        line-height: 1.6;
      }
      .risk-callout-title {
        font-weight: 700;
        color: var(--red);
        margin-bottom: 4px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ─── Data ─────────────────────────────────────────────────────────────────────

      const COMPANIES = [
        {
          emoji: "👟",
          name: "NimbleStride",
          industry: "Athletic Footwear",
          product: "Running shoes & sports apparel",
          bg: "#0f1f3d",
        },
        {
          emoji: "💊",
          name: "MediCore",
          industry: "Pharmaceuticals",
          product: "Generic medicines & supplements",
          bg: "#0f1f30",
        },
        {
          emoji: "🚗",
          name: "VoltDrive",
          industry: "Electric Vehicles",
          product: "EV components & charging units",
          bg: "#111f2e",
        },
        {
          emoji: "🍫",
          name: "CocoaBliss",
          industry: "Food & Beverage",
          product: "Chocolate & confectionery",
          bg: "#1a1208",
        },
        {
          emoji: "📱",
          name: "PixelForge",
          industry: "Consumer Electronics",
          product: "Smartphones & accessories",
          bg: "#0d1525",
        },
        {
          emoji: "🪑",
          name: "FormLab",
          industry: "Furniture & Home",
          product: "Flat-pack furniture & décor",
          bg: "#101a18",
        },
        {
          emoji: "🌾",
          name: "AgriPrime",
          industry: "Agriculture",
          product: "Packaged grains & pulses",
          bg: "#111a0f",
        },
        {
          emoji: "🧴",
          name: "GlowCraft",
          industry: "Personal Care",
          product: "Skincare & beauty products",
          bg: "#1a0f1a",
        },
      ];

      const COUNTRIES = [
        "India",
        "USA",
        "Germany",
        "Brazil",
        "Japan",
        "UAE",
        "UK",
        "Australia",
        "Canada",
        "South Africa",
      ];
      const DEMANDS = [
        {
          label: "High",
          color: "#10b981",
          desc: "Strong, consistent orders year-round",
        },
        {
          label: "Seasonal",
          color: "#f59e0b",
          desc: "Peaks around holidays and festivals",
        },
        {
          label: "Growing",
          color: "#3b82f6",
          desc: "Rapidly expanding into new markets",
        },
        {
          label: "Volatile",
          color: "#ef4444",
          desc: "Unpredictable, spikes with trends",
        },
      ];

      function randomPick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }
      function randomSubset(arr, min, max) {
        const n = min + Math.floor(Math.random() * (max - min + 1));
        const shuffled = [...arr].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, n);
      }

      function generateCompany() {
        const base = randomPick(COMPANIES);
        const markets = randomSubset(COUNTRIES, 2, 4);
        const demand = randomPick(DEMANDS);
        return { ...base, markets, demand };
      }

      // ─── Steps config ─────────────────────────────────────────────────────────────

      const STEPS = [
        { id: "suppliers", label: "Suppliers" },
        { id: "factory", label: "Factory" },
        { id: "warehouse", label: "Warehouse" },
        { id: "transport", label: "Transport" },
        { id: "inventory", label: "Inventory" },
      ];

      const STEP_DATA = {
        suppliers: {
          concept: {
            title: "What is a Supplier?",
            body: "A supplier provides the raw materials or parts your factory needs to make the product. Think of them as the roots of a tree — without them, nothing grows. Choosing how many suppliers you rely on is one of the most critical decisions in supply chain management.",
          },
          question: "How many suppliers will you use?",
          sub: "More suppliers = more options, but also more relationships to manage.",
          options: [
            {
              id: "single",
              icon: "🔗",
              title: "Single Supplier",
              desc: "One trusted partner for all materials. Deep relationship, volume discounts, streamlined communication.",
              tags: [
                { l: "Low Cost", t: "green" },
                { l: "High Risk", t: "red" },
                { l: "Simple", t: "blue" },
              ],
              delta: { cost: +8, speed: +5, risk: -20, sat: +5, sus: +2 },
              tradeoff:
                'Lower cost and simpler to manage, but if this supplier has a problem (disaster, strike, factory fire), your entire production stops. This is called a "single point of failure."',
            },
            {
              id: "dual",
              icon: "🤝",
              title: "Dual Suppliers",
              desc: "Two suppliers for key materials. One primary, one backup ready to step in.",
              tags: [
                { l: "Moderate Cost", t: "yellow" },
                { l: "Balanced Risk", t: "blue" },
                { l: "Smart", t: "green" },
              ],
              delta: { cost: -4, speed: +3, risk: +10, sat: +8, sus: +3 },
              tradeoff:
                "Costs slightly more because you split volumes (smaller orders = fewer discounts), but you have a backup if one fails. Most experienced companies use this model.",
            },
            {
              id: "multi",
              icon: "🌐",
              title: "Multiple Suppliers (3+)",
              desc: "Three or more suppliers competing for your business. Maximum redundancy and negotiating power.",
              tags: [
                { l: "Higher Cost", t: "red" },
                { l: "Low Risk", t: "green" },
                { l: "Complex", t: "yellow" },
              ],
              delta: { cost: -10, speed: -3, risk: +25, sat: +6, sus: -2 },
              tradeoff:
                "Maximum protection against disruption and strong negotiating power, but coordinating many suppliers adds complexity, paperwork, and management overhead. Quality can also vary between suppliers.",
            },
          ],
        },
        factory: {
          concept: {
            title: "Where Should Your Factory Be?",
            body: "The factory location determines how far finished goods must travel to reach customers, how much you pay workers, and whether production can be disrupted by political or logistical issues. This is a major strategic choice that affects cost, speed, and risk for years.",
          },
          question: "Where will you manufacture?",
          sub: "Location affects wages, shipping time, and political risk.",
          options: [
            {

      // ─── Metric helpers ────────────────────────────────────────────────────────────

      const BASE_METRICS = { cost: 50, speed: 50, risk: 50, sat: 50, sus: 50 };

      function clamp(v) {
        return Math.max(0, Math.min(100, v));
      }

      function applyDelta(metrics, delta) {
        return {
          cost: clamp(metrics.cost + (delta.cost || 0)),
          speed: clamp(metrics.speed + (delta.speed || 0)),
          risk: clamp(metrics.risk + (delta.risk || 0)),
          sat: clamp(metrics.sat + (delta.sat || 0)),
          sus: clamp(metrics.sus + (delta.sus || 0)),
        };
      }

      function metricColor(v) {
        if (v >= 70) return "#10b981";
        if (v >= 45) return "#f59e0b";
        return "#ef4444";
      }

      function calcScore(m) {
        return Math.round(
          m.cost * 0.2 +
            m.speed * 0.2 +
            m.risk * 0.25 +
            m.sat * 0.25 +
            m.sus * 0.1,
        );
      }

        const [selected, setSelected] = useState(null);
        const data = STEP_DATA[stepId];
        const stepIndex = STEPS.findIndex((s) => s.id === stepId);

        function handleConfirm() {
          if (!selected) return;
          const opt = data.options.find((o) => o.id === selected);
          onDecide(opt);
        }

        const selectedOpt = selected
          ? data.options.find((o) => o.id === selected)
          : null;

        return (

            <StepProgress current={stepId} />
            <MetricsBar metrics={metrics} />

            <CompanyCard company={company} />

              </div>
              <div className="dash-block">
                <div className="dash-block-title">⚠️ Weaknesses</div>
                <ul className="dash-list red">
                  {weaknesses.map((w, i) => (
                    <li key={i}>{w}</li>
                  ))}
                </ul>
              </div>
            </div>

            <div className="card card-sm" style={{ marginBottom: 12 }}>
              <div className="risk-callout">
                <div className="risk-callout-icon">🚨</div>
                <div>
                  <div className="risk-callout-title">
                    Biggest Risk:{" "}
                    {metricDefs.find((d) => d.key === lowestMetric.key)?.label}
                  </div>
                  <div className="risk-callout-body">
                    {riskMessages[lowestMetric.key]}
                  </div>
                </div>
              </div>
            </div>

            <div className="card">
              <div className="section-title">🔧 Top 3 Improvements</div>
              <div className="section-sub">
                Real, actionable steps to improve your supply chain score.
              </div>
              {improvements().map((imp, i) => (
                <div className="improvement-item" key={i}>
                  <div className="improvement-num">{i + 1}</div>
                  <div className="improvement-text">{imp}</div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      // ─── Main App ──────────────────────────────────────────────────────────────────

      function App() {
        const [screen, setScreen] = useState("welcome"); // welcome | reveal | step | dashboard
        const [company, setCompany] = useState(null);
        const [stepIndex, setStepIndex] = useState(0);
        const [metrics, setMetrics] = useState({ ...BASE_METRICS });
        const [choices, setChoices] = useState({});

        function startGame() {
          const c = generateCompany();
          setCompany(c);
          setScreen("reveal");
          setMetrics({ ...BASE_METRICS });
          setStepIndex(0);
          setChoices({});
        }

        function beginSteps() {
          setScreen("step");
        }

        function handleDecision(opt) {
          const newMetrics = applyDelta(metrics, opt.delta);
          setMetrics(newMetrics);
          setChoices((prev) => ({ ...prev, [STEPS[stepIndex].id]: opt.id }));
          if (stepIndex < STEPS.length - 1) {
            setStepIndex((i) => i + 1);
          } else {
            setScreen("dashboard");
          }
        }

        function replay() {
          setScreen("welcome");
        }

        return (
          <div className="app-wrapper">
            <div className="app-header">
              <div className="header-icon">🏭</div>
              <div>
                <div className="header-title">Supply Chain Builder</div>
                <div className="header-sub">
                  Learn how products move from factory to customer
                </div>
              </div>
              {screen !== "welcome" && (
                <button
                  className="btn btn-secondary"
                  onClick={replay}
                  style={{
                    marginLeft: "auto",
                    fontSize: 12,
                    padding: "7px 14px",
                  }}
                >
                  🔄 Restart
                </button>
              )}
            </div>

            {screen === "welcome" && <WelcomeScreen onStart={startGame} />}
            {screen === "reveal" && company && (
              <CompanyReveal company={company} onContinue={beginSteps} />
            )}
            {screen === "step" && company && (
              <DecisionStep
                key={STEPS[stepIndex].id}
                stepId={STEPS[stepIndex].id}
                metrics={metrics}
                company={company}
                onDecide={handleDecision}
              />
            )}
            {screen === "dashboard" && company && (
              <>
                <Dashboard
                  company={company}
                  choices={choices}
                  metrics={metrics}
                />
                <div style={{ textAlign: "center", marginTop: 24 }}>
                  <button
                    className="btn btn-green"
                    onClick={replay}
                    style={{ fontSize: 15, padding: "13px 36px" }}
                  >
                    🔄 Play Again with New Company
                  </button>
                </div>
              </>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
