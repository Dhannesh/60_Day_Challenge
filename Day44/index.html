<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Profile Room — LinkedIn Roast & Rebuild</title>
    <style>
      :root {
        --ink: #0b0c0e;
        --panel: #15171b;
        --panel-2: #1b1e23;
        --paper: #edeae2;
        --red: #d6402b;
        --red-dim: #7a2a1e;
        --green: #34c795;
        --muted: #8b8f97;
        --line: #2a2d33;
        --display: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
        --body:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        --mono: "Courier New", Courier, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--body);
      }
      body {
        min-height: 100vh;
      }
      ::selection {
        background: var(--red);
        color: #fff;
      }

      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 48px 24px 120px;
      }

      /* HERO */
      .hero {
        position: relative;
        padding: 20px 0 40px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 40px;
      }
      .eyebrow {
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--red);
        margin: 0 0 14px;
      }
      .hero h1 {
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(34px, 6vw, 58px);
        line-height: 1.02;
        margin: 0 0 18px;
        color: var(--paper);
      }
      .hero h1 em {
        font-style: italic;
        color: var(--red);
      }
      .hero p {
        font-size: 17px;
        line-height: 1.6;
        color: var(--muted);
        max-width: 560px;
        margin: 0;
      }
      .redmark {
        position: absolute;
        right: 0;
        top: 10px;
        width: 130px;
        opacity: 0.9;
      }

      /* WIZARD */
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 2px;
        padding: 32px;
        margin-bottom: 22px;
        position: relative;
      }
      .card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--red);
      }
      .step-label {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 6px;
      }
      .q {
        font-family: var(--display);
        font-size: 22px;
        line-height: 1.3;
        margin: 0 0 18px;
        color: var(--paper);
      }
      .hint {
        font-size: 13px;
        color: var(--muted);
        margin: -12px 0 16px;
      }

      textarea,
      input[type="text"] {
        width: 100%;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 2px;
        color: var(--paper);
        font-family: var(--body);
        font-size: 15px;
        padding: 14px;
        resize: vertical;
        transition: border-color 0.15s;
      }
      textarea:focus,
      input[type="text"]:focus {
        outline: none;
        border-color: var(--red);
      }
      textarea {
        min-height: 90px;
      }
      label.field {
        display: block;
        margin-bottom: 18px;
      }
      label.field span.fl {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
        font-family: var(--mono);
        letter-spacing: 0.04em;
      }

      .choice-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .choice {
        background: var(--panel-2);
        border: 1px solid var(--line);
        color: var(--paper);
        padding: 12px 18px;
        border-radius: 2px;
        cursor: pointer;
        font-size: 14px;
        font-family: var(--body);
        transition: all 0.15s;
      }
      .choice:hover {
        border-color: var(--red);
      }
      .choice.selected {
        border-color: var(--red);
        background: rgba(214, 64, 43, 0.12);
        color: #fff;
      }

      .btnrow {
        display: flex;
        gap: 12px;
        margin-top: 24px;
        justify-content: space-between;
        align-items: center;
      }
      .btn {
        background: var(--red);
        color: #fff;
        border: none;
        padding: 14px 26px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 2px;
        cursor: pointer;
        font-family: var(--body);
        letter-spacing: 0.02em;
        transition:
          transform 0.1s,
          background 0.15s;
      }
      .btn:hover {
        background: #ea4e37;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .btn.ghost {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .btn.ghost:hover {
        border-color: var(--muted);
        color: var(--paper);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .progress {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }

      /* LOADING */
      .loading {
        text-align: center;
        padding: 80px 20px;
      }
      .loading .pen {
        width: 60px;
        height: 60px;
        margin: 0 auto 24px;
        animation: scribble 1.1s ease-in-out infinite;
      }
      @keyframes scribble {
        0%,
        100% {
          transform: rotate(-8deg);
        }
        50% {
          transform: rotate(8deg);
        }
      }
      .loading p {
        font-family: var(--display);
        font-size: 19px;
        color: var(--muted);
        font-style: italic;
      }

      /* REPORT */
      .section-title {
        font-family: var(--display);
        font-size: 28px;
        margin: 56px 0 20px;
        color: var(--paper);
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .section-title .tag {
        font-family: var(--mono);
        font-size: 11px;
        background: var(--red);
        color: #fff;
        padding: 4px 10px;
        letter-spacing: 0.1em;
      }

      .overall {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 36px;
        padding: 36px;
        background: var(--panel);
        border: 1px solid var(--line);
        margin-bottom: 28px;
        position: relative;
      }
      .grade-circle {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        border: 3px solid var(--red);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        font-family: var(--display);
      }
      .grade-circle .num {
        font-size: 32px;
        font-weight: 700;
      }
      .grade-circle .lbl {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.1em;
      }
      .grade-circle.after {
        border-color: var(--green);
      }
      .arrow {
        font-size: 28px;
        color: var(--muted);
      }

      .scorecard {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 26px;
        margin-bottom: 14px;
      }
      .scorecard-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 14px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .scorecard-head h3 {
        font-family: var(--display);
        font-size: 20px;
        margin: 0;
        color: var(--paper);
      }
      .score-badge {
        font-family: var(--mono);
        font-size: 14px;
        color: var(--red);
        border: 1px solid var(--red-dim);
        padding: 4px 10px;
      }
      .sc-block {
        margin-bottom: 12px;
        font-size: 14.5px;
        line-height: 1.6;
      }
      .sc-block b {
        color: var(--paper);
      }
      .sc-block .icon {
        margin-right: 6px;
      }
      .reaction {
        font-style: italic;
        color: var(--muted);
        border-left: 2px solid var(--line);
        padding-left: 14px;
        margin-bottom: 14px;
      }

      .before-after {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin: 12px 0;
      }
      @media (max-width: 640px) {
        .before-after {
          grid-template-columns: 1fr;
        }
      }
      .ba-col {
        padding: 16px;
        background: var(--panel-2);
        border: 1px solid var(--line);
      }
      .ba-col.before {
        border-left: 3px solid var(--red-dim);
      }
      .ba-col.after {
        border-left: 3px solid var(--green);
      }
      .ba-label {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .ba-col.before .ba-label {
        color: var(--red);
      }
      .ba-col.after .ba-label {
        color: var(--green);
      }
      .ba-col p {
        margin: 0;
        font-size: 14px;
        line-height: 1.55;
      }

      .headline-opt {
        background: var(--panel-2);
        border: 1px solid var(--line);
        padding: 18px;
        margin-bottom: 12px;
      }
      .headline-opt .opt-tag {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--red);
        letter-spacing: 0.08em;
        margin-bottom: 8px;
      }
      .headline-opt .txt {
        font-size: 16.5px;
        line-height: 1.5;
        color: var(--paper);
        margin-bottom: 8px;
      }
      .headline-opt .when {
        font-size: 13px;
        color: var(--muted);
        font-style: italic;
      }

      .about-block {
        margin-bottom: 16px;
      }
      .about-block .lbl {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--red);
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }
      .about-block p {
        font-size: 15px;
        line-height: 1.65;
        margin: 0;
      }
      .keywords {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .kw {
        font-family: var(--mono);
        font-size: 12px;
        background: rgba(52, 199, 149, 0.12);
        color: var(--green);
        border: 1px solid rgba(52, 199, 149, 0.3);
        padding: 4px 10px;
      }

      .skill-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      @media (max-width: 640px) {
        .skill-cols {
          grid-template-columns: 1fr;
        }
      }
      .skill-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .skill-list li {
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        font-size: 14.5px;
        display: flex;
        gap: 10px;
      }
      .skill-list li .n {
        font-family: var(--mono);
        color: var(--muted);
        font-size: 12px;
      }
      .skill-pin {
        display: inline-block;
        background: var(--red);
        color: #fff;
        font-family: var(--mono);
        font-size: 11px;
        padding: 5px 10px;
        margin: 4px 6px 0 0;
      }

      .day {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 22px 26px;
        margin-bottom: 12px;
        display: flex;
        gap: 20px;
      }
      .day .daynum {
        font-family: var(--display);
        font-size: 34px;
        color: var(--red);
        min-width: 44px;
        line-height: 1;
      }
      .day .content h4 {
        margin: 0 0 8px;
        font-family: var(--display);
        font-size: 19px;
        color: var(--paper);
      }
      .day .content p {
        margin: 0 0 8px;
        font-size: 14.5px;
        line-height: 1.6;
        color: var(--paper);
      }
      .day .content .draft {
        background: var(--panel-2);
        border-left: 2px solid var(--red);
        padding: 12px 14px;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        margin-top: 8px;
        color: var(--muted);
      }

      .summary-card {
        background: var(--paper);
        color: var(--ink);
        padding: 36px;
        position: relative;
        margin-top: 20px;
        font-family: var(--display);
      }
      .summary-card::before {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px dashed var(--red-dim);
        pointer-events: none;
      }
      .summary-card h3 {
        margin: 0 0 18px;
        font-size: 22px;
      }
      .summary-card .scores {
        display: flex;
        gap: 30px;
        margin-bottom: 18px;
        font-family: var(--mono);
        font-size: 15px;
      }
      .summary-card .scores b {
        font-size: 22px;
      }
      .summary-card ol {
        padding-left: 20px;
        margin: 0 0 16px;
        font-family: var(--body);
        font-size: 14.5px;
        line-height: 1.7;
      }
      .summary-card .topchange {
        font-family: var(--body);
        font-size: 15px;
        font-style: italic;
        border-top: 1px solid var(--red-dim);
        padding-top: 14px;
      }

      .actions-final {
        display: flex;
        gap: 12px;
        margin-top: 36px;
        flex-wrap: wrap;
      }
      .err {
        background: rgba(214, 64, 43, 0.1);
        border: 1px solid var(--red);
        padding: 18px;
        font-size: 14px;
        color: var(--paper);
        margin-bottom: 16px;
      }

      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: var(--ink);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line);
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"></div>

    <script>
      const state = {
        step: 0,
        hasProfile: null,
        data: {},
        goal: null,
        result: null,
      };

      const GOALS = [
        "Job Search",
        "Client Acquisition",
        "Thought Leadership",
        "Network Growth",
      ];

      function el(html) {
        const d = document.createElement("div");
        d.innerHTML = html;
        return d.firstElementChild;
      }

      function render() {
        const app = document.getElementById("app");
        app.innerHTML = "";
        app.appendChild(hero());

        if (state.result) {
          app.appendChild(reportView());
          return;
        }
        if (state.step === 0) app.appendChild(stepIntro());
        else if (state.step === 1) app.appendChild(stepHasProfile());
        else if (state.step === 2)
          app.appendChild(
            state.hasProfile ? stepProfileForm() : stepNoProfileForm(),
          );
        else if (state.step === 3) app.appendChild(stepGoal());
        else if (state.step === 4) app.appendChild(loadingView());
      }

      function hero() {
        return el(`
    <div class="hero">
      <svg class="redmark" viewBox="0 0 130 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="65" cy="45" rx="55" ry="30" stroke="#D6402B" stroke-width="2.5" transform="rotate(-6 65 45)"/>
      </svg>
      <p class="eyebrow">Ex-Recruiter Review · 50,000+ Profiles Seen</p>
      <h1>Your profile isn't<br><em>working for you.</em></h1>
      <p>Answer a few questions. Get roasted, honestly. Then get a full rebuild — headline, About section, experience bullets, skills, and a 7-day plan to make people stop scrolling.</p>
    </div>
  `);
      }

      function progress(step, total) {
        return `<div class="progress">STEP ${step} / ${total}</div>`;
      }

      function stepIntro() {
        const c = el(`
    <div class="card">
      <p class="step-label">${progress(1, 4)}</p>
      <h2 class="q">Do you already have a LinkedIn profile up?</h2>
      <p class="hint">If yes, we'll roast what's there. If not, we'll build your profile strategy from scratch.</p>
      <div class="choice-row" id="hp-row">
        <div class="choice" data-v="yes">Yes, roast me</div>
        <div class="choice" data-v="no">No, starting fresh</div>
      </div>
    </div>
  `);
        c.querySelectorAll(".choice").forEach((ch) => {
          ch.onclick = () => {
            state.hasProfile = ch.dataset.v === "yes";
            state.step = 2;
            render();
          };
        });
        return c;
      }

      function stepHasProfile() {
        return stepIntro();
      } // unused fallback

      function fieldTextarea(key, label, hint, placeholder) {
        return `<label class="field"><span class="fl">${label}</span>
    <textarea data-key="${key}" placeholder="${placeholder || ""}">${state.data[key] || ""}</textarea>
    ${hint ? `<div class="hint" style="margin-top:6px;">${hint}</div>` : ""}
  </label>`;
      }
      function fieldInput(key, label, placeholder) {
        return `<label class="field"><span class="fl">${label}</span>
    <input type="text" data-key="${key}" placeholder="${placeholder || ""}" value="${state.data[key] || ""}">
  </label>`;
      }

      function stepProfileForm() {
        const c = el(`
    <div class="card">
      <p class="step-label">${progress(2, 4)}</p>
      <h2 class="q">Paste in what you've got. No polishing it first — that's my job.</h2>
      ${fieldTextarea("headline", "Current Headline", "", "e.g. Software Engineer at XYZ | Passionate about tech")}
      ${fieldTextarea("about", "About Section", "", "Paste your full About section")}
      ${fieldInput("expTitle", "Most Recent Role — Title", "e.g. Senior Software Engineer")}
      ${fieldInput("expCompany", "Most Recent Role — Company", "e.g. Acme Corp")}
      ${fieldTextarea("expBullets", "Most Recent Role — Bullets", "One per line is fine")}
      ${fieldTextarea("skills", "Top Skills (5–10)", "Comma-separated", "e.g. Python, React, Leadership, SQL...")}
      <div class="btnrow">
        <button class="btn ghost" id="back">Back</button>
        <button class="btn" id="next">Continue</button>
      </div>
    </div>
  `);
        bindInputs(c);
        c.querySelector("#back").onclick = () => {
          state.step = 0;
          render();
        };
        c.querySelector("#next").onclick = () => {
          if (!state.data.headline || !state.data.about) {
            alert("At least fill in your Headline and About section.");
            return;
          }
          state.step = 3;
          render();
        };
        return c;
      }

      function stepNoProfileForm() {
        const c = el(`
    <div class="card">
      <p class="step-label">${progress(2, 4)}</p>
      <h2 class="q">No profile yet? Good — no bad habits to unlearn. Tell me about you.</h2>
      ${fieldInput("name", "Name & Current Role / Student Status", "e.g. Priya Sharma, final-year CS student")}
      ${fieldTextarea("topSkills", "Top 3 Skills", "")}
      ${fieldTextarea("achievements", "1–2 Achievements or Projects You Are Proud Of", "")}
      ${fieldInput("attract", "Who Do You Want to Attract?", "Recruiters, clients, collaborators...")}
      ${fieldTextarea("different", "One Sentence: What Makes You Different?", "")}
      <div class="btnrow">
        <button class="btn ghost" id="back">Back</button>
        <button class="btn" id="next">Continue</button>
      </div>
    </div>
  `);
        bindInputs(c);
        c.querySelector("#back").onclick = () => {
          state.step = 0;
          render();
        };
        c.querySelector("#next").onclick = () => {
          if (!state.data.name) {
            alert("At least tell me your name and current role.");
            return;
          }
          state.step = 3;
          render();
        };
        return c;
      }

      function bindInputs(container) {
        container.querySelectorAll("[data-key]").forEach((inp) => {
          inp.addEventListener("input", (e) => {
            state.data[inp.dataset.key] = e.target.value;
          });
        });
      }

      function stepGoal() {
        const c = el(`
    <div class="card">
      <p class="step-label">${progress(3, 4)}</p>
      <h2 class="q">What's this profile actually for?</h2>
      <p class="hint">This decides which headline style and which posts we build in the 7-day plan.</p>
      <div class="choice-row" id="goal-row">
        ${GOALS.map((g) => `<div class="choice" data-v="${g}">${g}</div>`).join("")}
      </div>
      <div class="btnrow">
        <button class="btn ghost" id="back">Back</button>
        <button class="btn" id="go" disabled>Roast Me</button>
      </div>
    </div>
  `);
        c.querySelectorAll(".choice").forEach((ch) => {
          ch.onclick = () => {
            c.querySelectorAll(".choice").forEach((x) =>
              x.classList.remove("selected"),
            );
            ch.classList.add("selected");
            state.goal = ch.dataset.v;
            c.querySelector("#go").disabled = false;
          };
        });
        c.querySelector("#back").onclick = () => {
          state.step = 2;
          render();
        };
        c.querySelector("#go").onclick = () => {
          state.step = 4;
          render();
          runRoast();
        };
        return c;
      }

      function loadingView() {
        return el(`
    <div class="loading">
      <svg class="pen" viewBox="0 0 60 60" fill="none">
        <path d="M10 50 L40 20 L48 28 L18 58 Z" stroke="#D6402B" stroke-width="2" fill="none"/>
        <path d="M40 20 L48 28" stroke="#D6402B" stroke-width="2"/>
        <path d="M8 52 Q 6 56 10 58" stroke="#D6402B" stroke-width="2" fill="none"/>
      </svg>
      <p>Reading between the lines...</p>
    </div>
  `);
      }

      function buildPrompt() {
        let profileSection = "";
        if (state.hasProfile) {
          profileSection = `
CURRENT HEADLINE: ${state.data.headline || "(not provided)"}
CURRENT ABOUT SECTION: ${state.data.about || "(not provided)"}
MOST RECENT EXPERIENCE: ${state.data.expTitle || ""} at ${state.data.expCompany || ""}
BULLETS: ${state.data.expBullets || "(not provided)"}
TOP SKILLS: ${state.data.skills || "(not provided)"}
TARGET GOAL: ${state.goal}
STATUS: Has an existing LinkedIn profile.`;
        } else {
          profileSection = `
NAME & ROLE/STUDENT STATUS: ${state.data.name || ""}
TOP 3 SKILLS: ${state.data.topSkills || ""}
ACHIEVEMENTS/PROJECTS: ${state.data.achievements || ""}
WHO THEY WANT TO ATTRACT: ${state.data.attract || ""}
WHAT MAKES THEM DIFFERENT: ${state.data.different || ""}
TARGET GOAL: ${state.goal}
STATUS: No LinkedIn profile yet — build headline/About/experience recommendations from scratch based on the info given.`;
        }

        return `You are a LinkedIn Optimization Expert, Personal Branding Consultant, and ex-Recruiter who has reviewed 50,000+ profiles. Roast the profile below honestly (zero fluff), then rebuild it, then give a 7-day activation plan. Use ONLY the information given — never invent achievements, roles, companies, or metrics. If information is missing, note what should be added instead of fabricating it. Keep tone direct, like a brutally honest friend who wants them to succeed.

USER INPUT:
${profileSection}

Respond with ONLY valid JSON (no markdown fences, no commentary before or after), matching exactly this schema:

{
  "overallBefore": <integer 0-100>,
  "overallAfter": <integer 0-100>,
  "sections": [
    { "name": "Headline", "before": <0-10>, "after": <0-10>, "reaction": "<recruiter's 3-second reaction>", "problem": "<specific problem, quoting their own words where possible>", "why": "<why it hurts>", "cost": "<invisible cost / opportunities lost>" },
    { "name": "About — First 2 Lines", "before": <0-10>, "after": <0-10>, "reaction": "...", "problem": "...", "why": "...", "cost": "..." },
    { "name": "About — Full Section", "before": <0-10>, "after": <0-10>, "reaction": "...", "problem": "...", "why": "...", "cost": "..." },
    { "name": "Experience", "before": <0-10>, "after": <0-10>, "reaction": "...", "problem": "...", "why": "...", "cost": "..." },
    { "name": "Skills & Keywords", "before": <0-10>, "after": <0-10>, "reaction": "...", "problem": "...", "why": "...", "cost": "..." }
  ],
  "headlines": [
    { "label": "Keyword-Optimized", "text": "...", "when": "when to use this one" },
    { "label": "Value-Proposition", "text": "...", "when": "..." },
    { "label": "Authority", "text": "...", "when": "..." }
  ],
  "about": { "hook": "...", "story": "...", "proof": "...", "cta": "...", "keywords": ["...", "..."] },
  "experienceBullets": [ { "before": "...", "after": "..." } ],
  "skills": { "add": ["...10 items in priority order"], "remove": ["..."], "pin": ["...3 items"] },
  "plan": [
    { "day": 1, "title": "Profile changes", "body": "checklist of exact edits to make", "draft": "" },
    { "day": 2, "title": "Publish Post #1", "body": "why this post, what it should do", "draft": "full post text, under 1300 characters" },
    { "day": 3, "title": "10 connection requests", "body": "exactly who to target", "draft": "connection message template, under 300 characters" },
    { "day": 4, "title": "Comment on 5 posts", "body": "explain the Value Comment formula: Agree + Add Insight + Ask a Question, applied to their niche", "draft": "" },
    { "day": 5, "title": "Publish Post #2", "body": "why this angle", "draft": "full lessons-learned or hot-take post text" },
    { "day": 6, "title": "Engage + 5 more requests", "body": "what engaging well looks like", "draft": "" },
    { "day": 7, "title": "Review the numbers", "body": "what profile views / acceptance rate mean and what to adjust", "draft": "" }
  ],
  "summary": { "mistakes": ["...3 items"], "topChange": "the #1 thing that made the biggest difference" }
}`;
      }

      async function runRoast() {
        try {
          const response = await fetch(
            "https://api.anthropic.com/v1/messages",
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                model: "claude-sonnet-4-6",
                max_tokens: 4000,
                messages: [{ role: "user", content: buildPrompt() }],
              }),
            },
          );
          const data = await response.json();
          const textBlock = (data.content || []).find((b) => b.type === "text");
          let raw = textBlock ? textBlock.text : "";
          raw = raw.replace(/```json|```/g, "").trim();
          state.result = JSON.parse(raw);
        } catch (err) {
          console.error(err);
          state.result = { error: true };
        }
        render();
      }

      function reportView() {
        if (state.result.error) {
          return el(
            `<div class="err">Something went wrong reading the response. <br><button class="btn" style="margin-top:12px;" onclick="location.reload()">Start Over</button></div>`,
          );
        }
        const r = state.result;
        const container = document.createDocumentFragment
          ? document.createElement("div")
          : null;

        let html = "";

        html += `<div class="section-title"><span class="tag">Part 1</span> The Roast</div>`;
        html += `<div class="overall">
    <div class="grade-circle"><span class="num">${r.overallBefore}</span><span class="lbl">BEFORE /100</span></div>
    <span class="arrow">→</span>
    <div class="grade-circle after"><span class="num">${r.overallAfter}</span><span class="lbl">AFTER /100</span></div>
  </div>`;

        (r.sections || []).forEach((s) => {
          html += `<div class="scorecard">
      <div class="scorecard-head"><h3>${s.name}</h3><span class="score-badge">${s.before}/10</span></div>
      <div class="reaction">"${s.reaction}"</div>
      <div class="sc-block"><span class="icon">❌</span><b>The problem:</b> ${s.problem}</div>
      <div class="sc-block"><span class="icon">🧠</span><b>Why it hurts:</b> ${s.why}</div>
      <div class="sc-block"><span class="icon">🔍</span><b>Invisible cost:</b> ${s.cost}</div>
    </div>`;
        });

        html += `<div class="section-title"><span class="tag">Part 2</span> The Rebuild</div>`;

        html += `<h3 style="font-family:var(--display);font-size:20px;">Headline Options</h3>`;
        (r.headlines || []).forEach((h) => {
          html += `<div class="headline-opt">
      <div class="opt-tag">${h.label}</div>
      <div class="txt">${h.text}</div>
      <div class="when">Use when: ${h.when}</div>
    </div>`;
        });

        if (r.about) {
          html += `<h3 style="font-family:var(--display);font-size:20px;margin-top:28px;">About Section (Rebuilt)</h3>
    <div class="scorecard">
      <div class="about-block"><div class="lbl">Hook</div><p>${r.about.hook}</p></div>
      <div class="about-block"><div class="lbl">Story</div><p>${r.about.story}</p></div>
      <div class="about-block"><div class="lbl">Proof</div><p>${r.about.proof}</p></div>
      <div class="about-block"><div class="lbl">CTA</div><p>${r.about.cta}</p></div>
      <div class="keywords">${(r.about.keywords || []).map((k) => `<span class="kw">${k}</span>`).join("")}</div>
    </div>`;
        }

        if ((r.experienceBullets || []).length) {
          html += `<h3 style="font-family:var(--display);font-size:20px;margin-top:28px;">Experience — Rewritten</h3>`;
          r.experienceBullets.forEach((b) => {
            html += `<div class="before-after">
        <div class="ba-col before"><div class="ba-label">Before</div><p>${b.before}</p></div>
        <div class="ba-col after"><div class="ba-label">After</div><p>${b.after}</p></div>
      </div>`;
          });
        }

        if (r.skills) {
          html += `<h3 style="font-family:var(--display);font-size:20px;margin-top:28px;">Skills</h3>
    <div class="scorecard">
      <div class="skill-cols">
        <div>
          <div class="lbl" style="font-family:var(--mono);font-size:11px;color:var(--green);margin-bottom:8px;">ADD (priority order)</div>
          <ul class="skill-list">${(r.skills.add || []).map((s, i) => `<li><span class="n">${String(i + 1).padStart(2, "0")}</span>${s}</li>`).join("")}</ul>
        </div>
        <div>
          <div class="lbl" style="font-family:var(--mono);font-size:11px;color:var(--red);margin-bottom:8px;">REMOVE</div>
          <ul class="skill-list">${(r.skills.remove || []).map((s) => `<li>${s}</li>`).join("")}</ul>
        </div>
      </div>
      <div style="margin-top:16px;"><div class="lbl" style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px;">PIN TO TOP</div>
      ${(r.skills.pin || []).map((s) => `<span class="skill-pin">${s}</span>`).join("")}</div>
    </div>`;
        }

        html += `<div class="section-title"><span class="tag">Part 4</span> 7-Day Activation Plan</div>`;
        (r.plan || []).forEach((d) => {
          html += `<div class="day">
      <div class="daynum">${String(d.day).padStart(2, "0")}</div>
      <div class="content">
        <h4>${d.title}</h4>
        <p>${d.body}</p>
        ${d.draft ? `<div class="draft">${d.draft}</div>` : ""}
      </div>
    </div>`;
        });

        html += `<div class="section-title"><span class="tag">Part 5</span> What I Learned Today</div>`;
        html += `<div class="summary-card">
    <h3>I let AI roast my LinkedIn profile today. Here's what changed:</h3>
    <div class="scores"><div>BEFORE <b>${r.overallBefore}</b>/100</div><div>AFTER <b>${r.overallAfter}</b>/100</div></div>
    <div class="lbl" style="font-family:var(--mono);font-size:11px;letter-spacing:.08em;margin-bottom:8px;">TOP 3 MISTAKES I WAS MAKING</div>
    <ol>${(r.summary?.mistakes || []).map((m) => `<li>${m}</li>`).join("")}</ol>
    <div class="topchange">The #1 thing that made the biggest difference: ${r.summary?.topChange || ""}</div>
  </div>`;

        html += `<div class="actions-final">
    <button class="btn ghost" onclick="window.print()">Save / Print</button>
    <button class="btn" onclick="location.reload()">Start Over</button>
  </div>`;

        const wrapper = el(`<div>${html}</div>`);
        return wrapper;
      }

      render();
    </script>
  </body>
</html>
