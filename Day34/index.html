<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marketing Detective</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
:root{
  --bg:#0a0e14;
  --bg2:#0f1420;
  --cork:#141a26;
  --accent:#3fa9f5;
  --accent2:#1e6fb8;
  --glow: rgba(63,169,245,0.45);
  --paper:#f4ecd8;
  --paper-dark:#e8dcc0;
  --ink:#1c1c1c;
  --sticky:#2b3550;
  --pin:#e34d4d;
  --text:#dbe4f0;
  --muted:#8a95ab;
  --border:#26314a;
  --success:#3fcf8e;
  --danger:#e5534b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Georgia', 'Times New Roman', serif;overflow-x:hidden;}
body{
  background-image:
    radial-gradient(circle at 20% 20%, rgba(63,169,245,0.06), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(63,169,245,0.05), transparent 40%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 2px);
  min-height:100vh;
}
#root{min-height:100vh;}
.wrap{max-width:1200px;margin:0 auto;padding:24px;}
h1,h2,h3{font-family:'Courier New', monospace;letter-spacing:1px;}
.glow-text{color:var(--accent);text-shadow:0 0 12px var(--glow);}
.btn{
  background:linear-gradient(180deg,var(--accent),var(--accent2));
  color:#04101c;border:none;padding:12px 22px;border-radius:6px;
  font-family:'Courier New',monospace;font-weight:bold;letter-spacing:1px;
  cursor:pointer;box-shadow:0 0 15px var(--glow), 0 4px 10px rgba(0,0,0,0.4);
  transition:transform .15s ease, box-shadow .15s ease;
  text-transform:uppercase;font-size:13px;
}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 0 25px var(--glow), 0 6px 14px rgba(0,0,0,0.5);}
.btn:active{transform:translateY(0) scale(0.98);}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);box-shadow:none;}
.btn.secondary:hover{background:rgba(63,169,245,0.1);}
.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none;}

/* ---------- Intro / Case Assignment ---------- */
.intro-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;
  text-align:center;padding:40px 20px;position:relative;
}
.badge-icon{
  width:110px;height:110px;border-radius:50%;
  border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;
  font-size:52px;margin-bottom:20px;box-shadow:0 0 30px var(--glow);
  animation:pulse 2.4s infinite ease-in-out;background:radial-gradient(circle, rgba(63,169,245,0.15), transparent);
}
@keyframes pulse{0%,100%{box-shadow:0 0 20px var(--glow);}50%{box-shadow:0 0 45px var(--glow);}}
.intro-screen h1{font-size:42px;margin:0 0 6px;color:var(--text);}
.intro-screen p.subtitle{color:var(--muted);font-size:16px;margin-bottom:36px;letter-spacing:2px;text-transform:uppercase;}
.folder-stack{position:relative;width:280px;height:190px;margin:0 auto 36px;cursor:pointer;}
.folder-stack .folder{
  position:absolute;width:100%;height:100%;background:var(--paper);border-radius:4px 10px 10px 10px;
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
  transition:transform .35s ease, box-shadow .35s ease;
  border:1px solid #c9bb95;
}
.folder-stack .folder:nth-child(1){transform:rotate(-6deg) translateY(6px);}
.folder-stack .folder:nth-child(2){transform:rotate(4deg) translateY(3px);}
.folder-stack .folder:nth-child(3){
  background:var(--paper-dark);display:flex;align-items:center;justify-content:center;
  color:var(--ink);font-family:'Courier New',monospace;font-weight:bold;font-size:14px;
  letter-spacing:2px;text-transform:uppercase;flex-direction:column;gap:8px;
}
.folder-stack:hover .folder:nth-child(1){transform:rotate(-10deg) translateY(0px);}
.folder-stack:hover .folder:nth-child(2){transform:rotate(7deg) translateY(-2px);}
.folder-stack:hover .folder:nth-child(3){box-shadow:0 0 20px var(--glow);}
.stamp{
  border:2px solid var(--danger);color:var(--danger);padding:4px 10px;border-radius:3px;
  transform:rotate(-8deg);font-size:11px;letter-spacing:2px;
}

.theme-note{color:var(--muted);font-size:12px;margin-top:30px;}

/* ---------- Case Assignment reveal ---------- */
.case-file{
  background:var(--paper);color:var(--ink);border-radius:6px;padding:30px;max-width:640px;margin:0 auto;
  box-shadow:0 20px 50px rgba(0,0,0,0.6);position:relative;
  font-family:'Courier New',monospace;
  border:1px solid #c9bb95;
  animation:fileOpen .5s ease;
}
@keyframes fileOpen{from{opacity:0;transform:translateY(20px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.case-file .tab{
  position:absolute;top:-16px;left:24px;background:var(--danger);color:#fff;padding:4px 14px;
  font-size:11px;letter-spacing:2px;border-radius:3px 3px 0 0;font-weight:bold;
}
.case-file h2{margin-top:6px;color:#1c1c1c;font-size:22px;}
.case-file .row{display:flex;justify-content:space-between;border-bottom:1px dashed #c9bb95;padding:8px 0;font-size:13px;}
.case-file .row span:first-child{color:#6b6248;text-transform:uppercase;letter-spacing:1px;font-size:11px;}
.case-file .row span:last-child{font-weight:bold;text-align:right;}

/* ---------- Investigation Board ---------- */
.board-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.progress-track{flex:1;min-width:200px;height:10px;background:var(--bg2);border-radius:6px;overflow:hidden;border:1px solid var(--border);}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));box-shadow:0 0 10px var(--glow);transition:width .5s ease;}
.corkboard{
  background:
    radial-gradient(rgba(0,0,0,0.15) 1px, transparent 1px) 0 0/14px 14px,
    linear-gradient(180deg,#4a3a28,#3a2d1f);
  border-radius:10px;padding:26px;border:10px solid #23180f;
  box-shadow:inset 0 0 60px rgba(0,0,0,0.5), 0 15px 40px rgba(0,0,0,0.5);
  min-height:520px;position:relative;
}
.evidence-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;}
.evidence-card{
  position:relative;background:var(--paper);color:var(--ink);border-radius:3px;padding:16px 14px 14px;
  box-shadow:3px 6px 14px rgba(0,0,0,0.45);cursor:grab;user-select:none;
  transition:transform .2s ease, box-shadow .2s ease;
  font-family:'Courier New',monospace;font-size:13px;min-height:150px;
  border:1px solid rgba(0,0,0,0.15);
}
.evidence-card.sticky{background:var(--sticky);color:#eef2ff;box-shadow:3px 6px 14px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);}
.evidence-card:hover{transform:translateY(-6px) rotate(-1deg) scale(1.02);box-shadow:0 0 22px var(--glow), 6px 10px 20px rgba(0,0,0,0.5);z-index:5;}
.evidence-card.examined{opacity:0.55;}
.evidence-card.examined::after{
  content:"✓ EXAMINED";position:absolute;bottom:8px;right:10px;color:var(--success);font-size:10px;font-weight:bold;letter-spacing:1px;
}
.pin{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #ff8a8a, var(--pin));box-shadow:0 3px 6px rgba(0,0,0,0.6);
}
.evidence-card h4{margin:6px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:0.5px;color:#3a2d1f;}
.evidence-card .preview{font-size:11.5px;color:#5c5340;line-height:1.4;}
.evidence-card .tag{
  display:inline-block;margin-top:8px;font-size:9.5px;background:var(--accent2);color:#fff;padding:2px 6px;
  border-radius:3px;letter-spacing:1px;
}
.string-hint{color:#f0e6c8;text-align:center;margin-bottom:14px;font-size:13px;letter-spacing:1px;opacity:0.8;font-style:italic;}

/* ---------- Modal / Evidence detail ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(4,7,12,0.78);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  animation:fadeIn .25s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  background:var(--paper);color:var(--ink);border-radius:8px;max-width:560px;width:100%;
  max-height:85vh;overflow-y:auto;padding:28px;box-shadow:0 25px 60px rgba(0,0,0,0.6);
  font-family:'Courier New',monospace;position:relative;animation:popIn .3s ease;
}
@keyframes popIn{from{opacity:0;transform:scale(0.92);}to{opacity:1;transform:scale(1);}}
.modal h3{margin-top:0;color:#1c1c1c;border-bottom:2px solid var(--accent2);padding-bottom:10px;}
.modal .close{position:absolute;top:14px;right:16px;cursor:pointer;font-size:18px;color:#6b6248;background:none;border:none;}
.modal table{width:100%;border-collapse:collapse;font-size:12.5px;}
.modal td{padding:6px 4px;border-bottom:1px dashed #c9bb95;vertical-align:top;}
.modal td:first-child{color:#6b6248;width:38%;text-transform:uppercase;font-size:10.5px;letter-spacing:0.5px;}
.comment-bubble{background:#eee3c8;border-radius:8px;padding:8px 12px;margin:6px 0;font-size:12.5px;font-style:italic;border-left:3px solid var(--accent2);}
.metric-bars{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
.metric-row{display:flex;align-items:center;gap:8px;font-size:11px;}
.metric-row .label{width:90px;color:#6b6248;text-transform:uppercase;letter-spacing:0.5px;}
.metric-bar-track{flex:1;height:8px;background:#d9cba0;border-radius:5px;overflow:hidden;}
.metric-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:5px;transition:width 1s ease;}
.metric-val{width:46px;text-align:right;font-weight:bold;font-size:11px;}

/* ---------- Accuse / Solve ---------- */
.solve-panel{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:24px;margin-top:24px;}
.option-list{display:grid;gap:10px;margin:16px 0;}
.option-btn{
  background:var(--cork);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:8px;
  text-align:left;cursor:pointer;font-family:'Georgia',serif;font-size:14px;transition:all .2s ease;
}
.option-btn:hover{border-color:var(--accent);box-shadow:0 0 12px var(--glow);transform:translateX(4px);}
.option-btn.selected{border-color:var(--accent);background:rgba(63,169,245,0.12);box-shadow:0 0 14px var(--glow);}
.option-btn.correct{border-color:var(--success);background:rgba(63,207,142,0.14);}
.option-btn.incorrect{border-color:var(--danger);background:rgba(229,83,75,0.14);}

/* ---------- Case Closed ---------- */
.closed-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;position:relative;}
.stamp-big{
  border:6px solid var(--success);color:var(--success);font-size:44px;font-weight:bold;letter-spacing:6px;
  padding:14px 34px;border-radius:8px;transform:rotate(-10deg) scale(0);
  animation:stampIn .5s cubic-bezier(.2,1.6,.4,1) forwards;text-transform:uppercase;
  box-shadow:0 0 40px rgba(63,207,142,0.5);
}
.stamp-big.fail{border-color:var(--danger);color:var(--danger);box-shadow:0 0 40px rgba(229,83,75,0.5);}
@keyframes stampIn{to{transform:rotate(-10deg) scale(1);}}
.confetti{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;}
.confetto{position:absolute;width:8px;height:14px;top:-20px;opacity:0.85;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0.2;}}

/* ---------- Learning Report ---------- */
.report-card{background:var(--paper);color:var(--ink);border-radius:8px;padding:28px;max-width:760px;margin:24px auto;
  font-family:'Courier New',monospace;box-shadow:0 20px 50px rgba(0,0,0,0.5);}
.report-card h3{border-bottom:2px solid var(--accent2);padding-bottom:8px;}
.report-section{margin-bottom:18px;}
.report-section h4{margin:0 0 6px;color:#3a2d1f;font-size:13px;text-transform:uppercase;letter-spacing:1px;}
.clue-item{background:#eee3c8;border-left:3px solid var(--accent2);padding:8px 12px;margin:6px 0;border-radius:0 6px 6px 0;font-size:12.5px;}
.improve-item{background:#e2f0e5;border-left:3px solid var(--success);padding:8px 12px;margin:6px 0;border-radius:0 6px 6px 0;font-size:12.5px;}

/* header nav */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;margin-bottom:6px;}
.topbar .logo{font-family:'Courier New',monospace;font-weight:bold;letter-spacing:2px;color:var(--accent);}
.detective-score{font-size:12px;color:var(--muted);letter-spacing:1px;}

.fade-section{animation:fadeSlide .4s ease;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

@media (max-width:640px){
  .intro-screen h1{font-size:30px;}
  .folder-stack{width:220px;height:150px;}
  .evidence-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));}
}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

/* ============ CASE DATA ============ */
const CASES = [
  {
    company:"LumaFit", industry:"Fitness & Wearables",
    objective:"Drive pre-orders for a new smart fitness ring",
    audience:"Health-conscious professionals, 25-40, urban",
    channels:["Instagram Ads","Influencer Seeding","Email"],
    budget:{ "Influencer":45, "Paid Social":35, "Email":10, "Content":10 },
    metrics:{ reach:"2.1M", ctr:"0.4%", engagement:"1.2%", conversions:"0.3%", sales:"$38,000" },
    comments:[
      "Beautiful ring but I have no idea what it actually tracks differently from my current watch.",
      "Saw 5 influencers post the exact same caption. Felt fake.",
      "Clicked the ad twice looking for pricing, couldn't find it."
    ],
    social:{ instagram:"High impressions, low saves", tiktok:"Not used", comments_sentiment:"Skeptical / Confused" },
    mistake:"The campaign emphasized influencer volume over message clarity, so audiences saw the product everywhere but never understood its unique value versus competitors.",
    clues:[
      "CTR is far below industry benchmark (0.4% vs ~1.1%) despite massive reach — a sign the creative isn't compelling enough to earn clicks.",
      "Multiple customer comments mention confusion about differentiation, not price or design.",
      "Influencer captions were nearly identical, suggesting no creative brief variation or unique value proposition per audience segment."
    ],
    explanation:"LumaFit chased reach through duplicated influencer content instead of clarifying its unique selling proposition. High visibility with low CTR and confused comments points to a messaging clarity failure, not a targeting or budget failure.",
    improvements:[
      "Develop a single, sharp value proposition (e.g., 'the only ring that tracks recovery in real time') and brief every influencer to convey it in their own words.",
      "Add a comparison chart against smartwatches directly in ad creative and landing page.",
      "Diversify creative formats (demo videos, unboxing, myth-busting) instead of repeating the same caption."
    ]
  },
  {
    company:"BrewNest Coffee", industry:"Food & Beverage",
    objective:"Increase foot traffic to 12 new café locations",
    audience:"Local urban commuters, 20-45",
    channels:["Google Local Ads","Facebook","Radio"],
    budget:{ "Local Search":30, "Facebook":30, "Radio":30, "Print":10 },
    metrics:{ reach:"480K", ctr:"2.1%", engagement:"3.4%", conversions:"0.1%", sales:"$9,200" },
    comments:[
      "Ad said 'Now Open' but when I drove there it was still under construction.",
      "Tried to redeem the coupon code but the barista said it expired last month.",
      "Great ad, terrible experience finding the actual store — GPS pin was wrong."
    ],
    social:{ instagram:"Moderate", facebook:"High complaints in comments", google_reviews:"Dropping" },
    mistake:"The campaign launched before store readiness and location data were verified, creating a mismatch between advertised promises and on-the-ground reality.",
    clues:[
      "Conversion rate (0.1%) is drastically lower than engagement (3.4%), meaning people were interested but blocked at the final step.",
      "Comments cite construction delays and wrong map pins — logistical, not creative, failures.",
      "An expired coupon still running in live ads suggests no post-launch QA process."
    ],
    explanation:"This is an operational-marketing misalignment: ads promised something the physical business couldn't yet deliver, and expired offers stayed live due to lack of coordination between marketing and store operations.",
    improvements:[
      "Implement a pre-launch checklist syncing marketing go-live dates with construction and staffing readiness.",
      "Audit all live offer codes weekly to catch expired promotions before customers do.",
      "Verify Google Maps and location data accuracy before any local ad spend begins."
    ]
  },
  {
    company:"Verdant Skincare", industry:"Beauty & Cosmetics",
    objective:"Launch a vegan skincare line to Gen Z",
    audience:"Gen Z, 16-24, sustainability-minded",
    channels:["TikTok Ads","TikTok Influencers","Website"],
    budget:{ "TikTok Ads":50, "Influencers":40, "Website":10 },
    metrics:{ reach:"3.4M", ctr:"1.8%", engagement:"6.5%", conversions:"0.2%", sales:"$14,500" },
    comments:[
      "Love the aesthetic but $68 for a moisturizer is wild for a college student.",
      "Everyone's talking about it on TikTok but nobody I know actually bought it.",
      "The video made it look like a $15 product, so the price felt like a bait and switch."
    ],
    social:{ tiktok:"Viral (12M views on top video)", instagram:"Growing", sentiment:"Excited then disappointed at checkout" },
    mistake:"Premium pricing was never signaled anywhere in the youthful, budget-implying creative, causing sticker shock at checkout that killed conversions despite viral engagement.",
    clues:[
      "Engagement (6.5%) is excellent but conversions (0.2%) collapse — the disconnect happens specifically at purchase, not attention.",
      "Every comment referencing price uses words like 'wild,' 'bait and switch,' — an emotional reaction to a mismatched expectation.",
      "Target audience (16-24, likely limited discretionary income) was shown premium pricing with no financing, bundling, or trial-size option."
    ],
    explanation:"The campaign achieved viral awareness but ignored price-to-audience fit. Gen Z audiences reacted to a perceived bait-and-switch because affordability cues in the creative implied a much lower price point than reality.",
    improvements:[
      "Introduce a trial or travel-size SKU at a lower price point to reduce entry friction.",
      "Be transparent about pricing within the first few seconds of video content to set correct expectations.",
      "Offer installment/BNPL checkout options suited to a younger audience's budget."
    ]
  },
  {
    company:"PathForward Insurance", industry:"Insurance",
    objective:"Generate qualified leads for term life insurance",
    audience:"New parents, 28-38",
    channels:["Facebook Ads","LinkedIn","SEO Blog"],
    budget:{ "Facebook":40, "LinkedIn":30, "SEO":30 },
    metrics:{ reach:"620K", ctr:"3.2%", engagement:"2.1%", conversions:"4.5%", sales:"$210,000" },
    comments:[
      "Filled out the quote form three times and never got a callback.",
      "Great content, but when I called the number on the ad nobody knew what promotion I meant.",
      "Got quoted a totally different price than what the ad promised."
    ],
    social:{ facebook:"Positive on content, negative on follow-up", linkedin:"Professional tone praised" },
    mistake:"Strong top-of-funnel performance was wasted because the sales/follow-up team wasn't aligned with the promotional offer, causing lead leakage after conversion.",
    clues:[
      "Conversion rate (4.5%) is actually strong, but sales revenue underperforms relative to lead volume, implying loss after the lead is captured.",
      "Multiple comments describe no callback or unaware phone reps — a handoff failure, not an ad failure.",
      "Quoted prices differ from advertised prices, indicating a disconnect between marketing promotions and sales/underwriting systems."
    ],
    explanation:"This is a funnel handoff failure: marketing successfully generated interest and leads, but the sales team lacked visibility into the specific offer, causing broken promises and lost trust right when deals should have closed.",
    improvements:[
      "Create a shared campaign brief between marketing and sales so every rep knows active offers and pricing.",
      "Set a maximum callback SLA (e.g., 24 hours) and track it with alerts for missed leads.",
      "Automatically tag inbound leads with the specific ad/offer they came from so pricing stays consistent."
    ]
  },
  {
    company:"Northline Outdoors", industry:"Outdoor & Apparel",
    objective:"Increase sales of a new waterproof jacket line",
    audience:"Outdoor enthusiasts, 25-55",
    channels:["YouTube Ads","Google Shopping","Email"],
    budget:{ "YouTube":35, "Shopping":45, "Email":20 },
    metrics:{ reach:"1.1M", ctr:"1.4%", engagement:"2.0%", conversions:"1.9%", sales:"$95,000" },
    comments:[
      "Ordered a medium based on the size chart and it fit like a small.",
      "Return process took 3 weeks and customer support went silent.",
      "Great jacket once it fit right, but I almost gave up after the first wrong size."
    ],
    social:{ instagram:"Positive product photos", reviews:"3.1 stars, mostly about sizing/returns" },
    mistake:"An inaccurate size chart combined with a slow return process caused high return-driven dissatisfaction, undermining an otherwise well-targeted and well-performing campaign.",
    clues:[
      "Conversions (1.9%) look healthy, but review sentiment centers heavily on sizing, not product quality.",
      "Customer comments describe long return timelines, suggesting operations couldn't handle the increased order volume the campaign generated.",
      "Star rating (3.1) is notably lower than industry average for the price tier despite otherwise strong marketing metrics."
    ],
    explanation:"The marketing did its job driving purchases, but a product-information gap (inaccurate sizing) paired with weak post-purchase support turned buyers into frustrated reviewers, damaging brand trust the campaign built.",
    improvements:[
      "Update the size chart using real customer fit data and add a 'true to size / runs small' indicator.",
      "Set a return SLA of under 7 business days and automate return label generation.",
      "Add size-specific customer photos and reviews on the product page to set accurate expectations."
    ]
  },
  {
    company:"Cognivo Learning", industry:"EdTech",
    objective:"Drive signups for an AI-powered tutoring app",
    audience:"Parents of middle/high schoolers",
    channels:["Facebook Ads","Podcast Sponsorships","Referral Program"],
    budget:{ "Facebook":30, "Podcasts":40, "Referral":30 },
    metrics:{ reach:"890K", ctr:"1.1%", engagement:"1.8%", conversions:"6.2%", sales:"$0 (free trial model)" },
    comments:[
      "Signed up for the free trial, got charged the day after with no reminder.",
      "The trial terms weren't clear about auto-renewal at all.",
      "Cancelled within the trial window but still got billed — support said it was 'policy'."
    ],
    social:{ podcast_reviews:"Positive, driven by host trust", app_store:"Rating dropping fast due to billing complaints" },
    mistake:"The campaign drove strong trial signups but obscured auto-renewal billing terms, generating a wave of trust-damaging billing complaints that overshadowed genuinely strong acquisition performance.",
    clues:[
      "Conversion rate (6.2%) is excellent, yet app store rating is falling — a sign the problem is post-signup, not acquisition.",
      "Every comment references billing surprises, not app quality or tutoring content.",
      "Podcast-driven trust (a channel built on credibility) is now being undermined by billing complaints, risking the sponsor relationship."

/* ============ Utility ============ */
function pickRandomCase(excludeIndex){
  let idx;
  do{ idx = Math.floor(Math.random()*CASES.length); } while(CASES.length>1 && idx===excludeIndex);
  return idx;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function metricScore(m){
  // rough numeric parse just for bar widths
  const num = parseFloat(String(m).replace(/[^0-9.]/g,'')) || 0;
  return num;
}

/* ============ Confetti ============ */
function Confetti(){
  const colors = ['#3fa9f5','#3fcf8e','#f0e6c8','#e34d4d','#1e6fb8'];
  const pieces = useMemo(()=>Array.from({length:60},(_,i)=>({
    id:i,
    left:Math.random()*100,
    delay:Math.random()*0.6,
    duration:2+Math.random()*1.6,
    color:colors[Math.floor(Math.random()*colors.length)],
    rotate:Math.random()*360
  })),[]);
  return (
    <div className="confetti">
      {pieces.map(p=>(
        <div key={p.id} className="confetto" style={{
          left:p.left+'%',
          background:p.color,
          animationDelay:p.delay+'s',
          animationDuration:p.duration+'s',
          transform:`rotate(${p.rotate}deg)`
        }}/>
      ))}
    </div>
  );
}

/* Build multiple choice options for the "mistake" question */
function buildOptions(caseObj, allCases){
  const correct = caseObj.mistake;
  const others = shuffle(allCases.filter(c=>c.company!==caseObj.company)).slice(0,3).map(c=>c.mistake);
  const options = shuffle([correct, ...others]);
  return options;
}

/* ============ Main App ============ */
function App(){
  const [stage, setStage] = useState('intro'); // intro -> assigned -> board -> solve -> closed -> report
  const [caseIndex, setCaseIndex] = useState(null);
  const [examined, setExamined] = useState({});
  const [activeEvidence, setActiveEvidence] = useState(null);
  const [options, setOptions] = useState([]);
  const [selectedOption, setSelectedOption] = useState(null);
  const [answered, setAnswered] = useState(false);
  const [score, setScore] = useState({correct:0, total:0});

  const currentCase = caseIndex!==null ? CASES[caseIndex] : null;
  const evidenceItems = useMemo(()=> currentCase ? buildEvidenceItems(currentCase) : [], [currentCase]);
  const allExamined = evidenceItems.length>0 && evidenceItems.every(e=>examined[e.id]);

  function startNewCase(){
    const idx = pickRandomCase(caseIndex);
    setCaseIndex(idx);
    setExamined({});
    setActiveEvidence(null);
    setSelectedOption(null);
    setAnswered(false);
    setOptions(buildOptions(CASES[idx], CASES));
    setStage('assigned');
  }

  function openEvidence(item){
    setActiveEvidence(item);
    setExamined(prev=>({...prev, [item.id]:true}));
  }

  function submitAnswer(){
    if(selectedOption===null) return;
    setAnswered(true);
    setScore(s=>({correct: s.correct + (selectedOption===currentCase.mistake?1:0), total: s.total+1}));
    setTimeout(()=> setStage('closed'), 1600);
  }

  return (
    <div className="wrap">
      {stage!=='intro' && (
        <div className="topbar">
          <div className="logo">🔎 MARKETING DETECTIVE</div>
          <div className="detective-score">CASES SOLVED: {score.correct}/{score.total}</div>
        </div>
      )}

      {stage==='intro' && <IntroScreen onStart={startNewCase} />}

      {stage==='assigned' && currentCase && (
        <AssignedScreen caseObj={currentCase} onProceed={()=>setStage('board')} />
      )}

      {stage==='board' && currentCase && (
        <BoardScreen
          caseObj={currentCase}
          items={evidenceItems}
          examined={examined}
          allExamined={allExamined}
          onOpen={openEvidence}
          onSolve={()=>setStage('solve')}
        />
      )}

      {stage==='solve' && currentCase && (
        <SolveScreen
          caseObj={currentCase}
          options={options}
          selectedOption={selectedOption}
          setSelectedOption={setSelectedOption}
          answered={answered}
          onSubmit={submitAnswer}
        />
      )}

      {stage==='closed' && currentCase && (
        <ClosedScreen
          success={selectedOption===currentCase.mistake}
          onContinue={()=>setStage('report')}
        />
      )}

      {stage==='report' && currentCase && (
        <ReportScreen
          caseObj={currentCase}
          success={selectedOption===currentCase.mistake}
          selectedOption={selectedOption}
          onNewCase={startNewCase}
        />
      )}

      {activeEvidence && (
        <EvidenceModal item={activeEvidence} onClose={()=>setActiveEvidence(null)} />
      )}
    </div>
  );
}

/* ---------- Board ---------- */
function BoardScreen({caseObj, items, examined, allExamined, onOpen, onSolve}){
  const examinedCount = items.filter(i=>examined[i.id]).length;
  const pct = Math.round((examinedCount/items.length)*100);
  return (
    <div className="fade-section">
      <div className="board-header">
        <div style={{minWidth:220}}>
          <div style={{fontSize:12, color:'var(--muted)', marginBottom:4, letterSpacing:1}}>INVESTIGATION PROGRESS — {examinedCount}/{items.length} EXAMINED</div>
          <div className="progress-track"><div className="progress-fill" style={{width:pct+'%'}}/></div>
        </div>
        <button className="btn" disabled={!allExamined} onClick={onSolve}>
          {allExamined ? 'Solve the Case →' : 'Examine All Evidence First'}
        </button>
      </div>
      <div className="corkboard">
        <div className="string-hint">— pin, drag, and click evidence to examine it —</div>
        <div className="evidence-grid">
          {items.map(item=>(
            <EvidenceCard key={item.id} item={item} examined={!!examined[item.id]} onOpen={()=>onOpen(item)} />
          ))}
        </div>
      </div>
    </div>
  );
}

function EvidenceCard({item, examined, onOpen}){
  const ref = useRef(null);
  const [dragPos, setDragPos] = useState(null);
  const draggingRef = useRef(false);
  const startRef = useRef({x:0,y:0});

  function onMouseDown(e){
    draggingRef.current = true;
    startRef.current = {x:e.clientX, y:e.clientY};
    e.currentTarget.style.zIndex = 20;
  }
  function onMouseMove(e){
    if(!draggingRef.current) return;
    const dx = e.clientX - startRef.current.x;
    const dy = e.clientY - startRef.current.y;
    setDragPos({x:dx,y:dy});
  }
  function onMouseUp(e){
    const moved = dragPos && (Math.abs(dragPos.x)>6 || Math.abs(dragPos.y)>6);
    draggingRef.current = false;
    setDragPos(null);
    if(!moved){ onOpen(); }
  }

  return (
    <div
      className={"evidence-card" + (item.sticky?' sticky':'') + (examined?' examined':'')}
      style={dragPos ? {transform:`translate(${dragPos.x}px, ${dragPos.y}px) rotate(-1deg) scale(1.03)`} : undefined}
      onMouseDown={onMouseDown}
      onMouseMove={onMouseMove}
      onMouseUp={onMouseUp}
      onMouseLeave={()=>{ if(draggingRef.current){draggingRef.current=false; setDragPos(null);} }}
    >
      {!item.sticky && <div className="pin"></div>}
      <h4>{item.title}</h4>
      <div className="preview">{item.preview}</div>
      <span className="tag">{item.tag}</span>
    </div>
  );
}

/* ---------- Evidence Modal ---------- */
function EvidenceModal({item, onClose}){
  useEffect(()=>{
    function onKey(e){ if(e.key==='Escape') onClose(); }
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  },[]);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="close" onClick={onClose}>✕</button>
        <h3>{item.title}</h3>
        {item.detail}
      </div>
    </div>
  );
}

/* ---------- Solve Screen ---------- */
function SolveScreen({caseObj, options, selectedOption, setSelectedOption, answered, onSubmit}){
  return (
    <div className="fade-section">
      <h2 className="glow-text">SOLVE THE CASE</h2>
      <p style={{color:'var(--muted)'}}>Based on the evidence gathered on <strong style={{color:'var(--text)'}}>{caseObj.company}</strong>, what was the <em>primary marketing mistake</em>?</p>
      <div className="solve-panel">
        <div className="option-list">
          {options.map((opt,i)=>{
            let cls = "option-btn";
            if(selectedOption===opt) cls += " selected";
            if(answered){
              if(opt===caseObj.mistake) cls += " correct";
              else if(opt===selectedOption) cls += " incorrect";
            }
            return (
              <button key={i} className={cls} disabled={answered} onClick={()=>setSelectedOption(opt)}>
                {opt}
              </button>
            );
          })}
        </div>
        <button className="btn" disabled={selectedOption===null || answered} onClick={onSubmit}>
          {answered ? 'Case Closing...' : 'Submit Verdict'}
        </button>
      </div>
    </div>
  );
}

/* ---------- Closed Screen ---------- */
function ClosedScreen({success, onContinue}){
  useEffect(()=>{
    const t = setTimeout(onContinue, 2600);
    return ()=>clearTimeout(t);
  },[]);
  return (
    <div className="closed-screen">
      {success && <Confetti/>}
      <div className={"stamp-big" + (success?'':' fail')}>{success ? 'CASE CLOSED' : 'CASE REOPENED'}</div>
      <p style={{marginTop:24, color:'var(--muted)', letterSpacing:1}}>
        {success ? 'Sharp eyes, detective. Filing your report...' : 'Not quite — let\'s review what really happened...'}
      </p>
    </div>
  );
}

/* ---------- Report Screen ---------- */
function ReportScreen({caseObj, success, selectedOption, onNewCase}){
  return (
    <div className="fade-section" style={{paddingBottom:60}}>
      <h2 className="glow-text" style={{textAlign:'center'}}>LEARNING REPORT</h2>
      <div className="report-card">
        <h3>{caseObj.company} — Final Debrief</h3>

        <div className="report-section">
          <h4>Your Verdict</h4>
          <p style={{fontSize:13}}>{selectedOption}</p>
          <p style={{fontSize:12, color: success ? '#2e7d4f' : '#a83b34', fontWeight:'bold'}}>
            {success ? '✔ Correct — this matches the true root cause.' : '✘ Not the primary cause — see explanation below.'}
          </p>
        </div>

        <div className="report-section">
          <h4>The Actual Mistake</h4>
          <p style={{fontSize:13}}>{caseObj.mistake}</p>
        </div>

        <div className="report-section">
          <h4>Supporting Clues</h4>
          {caseObj.clues.map((c,i)=>(<div className="clue-item" key={i}>{c}</div>))}
        </div>

        <div className="report-section">
          <h4>Full Explanation</h4>
          <p style={{fontSize:13, lineHeight:1.6}}>{caseObj.explanation}</p>
        </div>

        <div className="report-section">
          <h4>Suggested Improvements</h4>
          {caseObj.improvements.map((imp,i)=>(<div className="improve-item" key={i}>{imp}</div>))}
        </div>
      </div>
      <div style={{textAlign:'center', marginTop:20}}>
        <button className="btn" onClick={onNewCase}>Investigate a New Case →</button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
