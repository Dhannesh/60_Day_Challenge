<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Operation Lifeline: Supply Chain Crisis Lab</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #070C18;
    --surface: #0F172A;
    --surface2: #1E293B;
    --surface3: #263349;
    --border: #1E293B;
    --border2: #334155;
    --blue: #3B82F6;
    --blue-dim: #1D4ED8;
    --blue-glow: rgba(59,130,246,0.2);
    --amber: #F59E0B;
    --amber-dim: #B45309;
    --emerald: #10B981;
    --emerald-dim: #065F46;
    --rose: #F43F5E;
    --rose-dim: #9F1239;
    --violet: #8B5CF6;
    --cyan: #06B6D4;
    --muted: #64748B;
    --text: #F1F5F9;
    --text2: #CBD5E1;
    --text3: #94A3B8;
    --radius: 14px;
    --radius-sm: 8px;
    --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  html, body, #root { height: 100%; width: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* Layout */
  .app { min-height: 100vh; display: flex; flex-direction: column; }
  .screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; animation: fadeIn 0.5s ease; }
  .screen-top { justify-content: flex-start; padding-top: 40px; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .container { width: 100%; max-width: 960px; margin: 0 auto; }
  .container-lg { width: 100%; max-width: 1100px; margin: 0 auto; }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    transition: var(--transition);
  }
  .card:hover { border-color: var(--border2); }
  .card-sm { padding: 16px; }
  .card-glow { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue), 0 0 30px var(--blue-glow); }
  .card-amber { border-color: var(--amber); box-shadow: 0 0 20px rgba(245,158,11,0.15); }
  .card-rose { border-color: var(--rose); box-shadow: 0 0 20px rgba(244,63,94,0.15); }
  .card-emerald { border-color: var(--emerald); box-shadow: 0 0 20px rgba(16,185,129,0.12); }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 24px; border-radius: var(--radius-sm); border: none; cursor: pointer;
    font-size: 14px; font-weight: 600; letter-spacing: 0.3px;
    transition: var(--transition); user-select: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--blue); color: white; }
  .btn-primary:hover { background: #2563EB; box-shadow: 0 0 20px rgba(59,130,246,0.4); }
  .btn-secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); }
  .btn-secondary:hover { background: var(--surface3); color: var(--text); }
  .btn-emerald { background: var(--emerald); color: white; }
  .btn-emerald:hover { background: #059669; box-shadow: 0 0 20px rgba(16,185,129,0.4); }
  .btn-amber { background: var(--amber); color: #1c1c1c; }
  .btn-amber:hover { background: #D97706; }
  .btn-lg { padding: 16px 36px; font-size: 16px; border-radius: var(--radius); }
  .btn-block { width: 100%; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }

  /* Typography */
  .title { font-size: clamp(28px, 5vw, 48px); font-weight: 800; line-height: 1.1; letter-spacing: -1px; }
  .subtitle { font-size: clamp(15px, 2vw, 18px); color: var(--text3); line-height: 1.6; }
  .heading { font-size: clamp(20px, 3vw, 28px); font-weight: 700; letter-spacing: -0.5px; }
  .subheading { font-size: 16px; font-weight: 600; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text3); }
  .mono { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; }

  /* Gradients */
  .gradient-text { background: linear-gradient(135deg, #60A5FA, #A78BFA, #34D399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .gradient-amber { background: linear-gradient(135deg, #F59E0B, #EF4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

  /* Badge */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  }
  .badge-blue { background: rgba(59,130,246,0.15); color: #60A5FA; border: 1px solid rgba(59,130,246,0.3); }
  .badge-amber { background: rgba(245,158,11,0.15); color: #FCD34D; border: 1px solid rgba(245,158,11,0.3); }
  .badge-rose { background: rgba(244,63,94,0.15); color: #FB7185; border: 1px solid rgba(244,63,94,0.3); }
  .badge-emerald { background: rgba(16,185,129,0.15); color: #34D399; border: 1px solid rgba(16,185,129,0.3); }
  .badge-violet { background: rgba(139,92,246,0.15); color: #A78BFA; border: 1px solid rgba(139,92,246,0.3); }
  .badge-cyan { background: rgba(6,182,212,0.15); color: #22D3EE; border: 1px solid rgba(6,182,212,0.3); }

  /* Grid */
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }

  /* Progress Bar */
  .progress-wrap { margin-bottom: 12px; }
  .progress-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .progress-track { height: 8px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .progress-fill {
    height: 100%; border-radius: 99px;
    transition: width 1.2s cubic-bezier(0.4,0,0.2,1);
  }

  /* Divider */
  .divider { height: 1px; background: var(--border); margin: 20px 0; }

  /* Step header */
  .step-header { text-align: center; margin-bottom: 32px; }
  .step-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface2); border: 1px solid var(--border2);
    padding: 6px 14px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--text3);
    margin-bottom: 16px;
  }

  /* Crisis pulse ring */
  @keyframes pulse-ring {
    0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(244,63,94,0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 18px rgba(244,63,94,0); }
    100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(244,63,94,0); }
  }
  .pulse-ring { animation: pulse-ring 2s infinite; display: inline-flex; }

  /* Stat box */
  .stat-box {
    background: var(--surface2); border-radius: var(--radius-sm);
    padding: 14px 16px;
    border: 1px solid var(--border);
  }
  .stat-val { font-size: 22px; font-weight: 800; font-family: 'SF Mono', monospace; }
  .stat-change { font-size: 12px; font-weight: 600; }
  .change-up { color: var(--emerald); }
  .change-down { color: var(--rose); }

  /* Action card */
  .action-card {
    background: var(--surface); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 18px; cursor: pointer;
    transition: var(--transition); position: relative;
  }
  .action-card:hover { border-color: var(--blue); background: var(--surface2); transform: translateY(-2px); }
  .action-card.selected { border-color: var(--blue); background: rgba(59,130,246,0.08); }
  .action-card.selected::after {
    content: '✓'; position: absolute; top: 12px; right: 14px;
    background: var(--blue); color: white; width: 22px; height: 22px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800;
  }

  /* Negotiation */
  .nego-track { display: flex; gap: 6px; margin: 12px 0; }
  .nego-dot { width: 28px; height: 6px; border-radius: 3px; background: var(--border2); transition: var(--transition); }
  .nego-dot.active { background: var(--blue); }
  .nego-dot.done { background: var(--emerald); }

  /* Choice button */
  .choice-btn {
    width: 100%; text-align: left; background: var(--surface2);
    border: 1px solid var(--border2); border-radius: var(--radius-sm);
    padding: 14px 16px; cursor: pointer; transition: var(--transition); color: var(--text);
    font-size: 14px; line-height: 1.5;
  }
  .choice-btn:hover { border-color: var(--blue); background: rgba(59,130,246,0.07); }
  .choice-btn.chosen { border-color: var(--emerald); background: rgba(16,185,129,0.08); }
  .choice-btn.unchosen { opacity: 0.45; }
  .choice-btn.wrong { border-color: var(--rose); background: rgba(244,63,94,0.08); }

  /* AI cards */
  .ai-card {
    background: var(--surface); border: 2px solid var(--border);
    border-radius: var(--radius); padding: 20px; cursor: pointer;
    transition: var(--transition);
  }
  .ai-card:hover { border-color: var(--violet); background: rgba(139,92,246,0.05); transform: translateY(-2px); }
  .ai-card.selected { border-color: var(--violet); background: rgba(139,92,246,0.1); }

  /* Score ring */
  .score-ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .score-circle {
    width: 120px; height: 120px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 4px solid var(--border2); background: var(--surface2);
    position: relative;
  }
  .score-big { font-size: 32px; font-weight: 900; font-family: 'SF Mono', monospace; }

  /* Welcome screen bg */
  .welcome-bg {
    position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(59,130,246,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 80% 100%, rgba(139,92,246,0.08) 0%, transparent 60%),
                var(--bg);
  }

  /* Info box */
  .info-box {
    background: rgba(59,130,246,0.07); border: 1px solid rgba(59,130,246,0.2);
    border-radius: var(--radius-sm); padding: 14px 16px; font-size: 13px; color: var(--text3); line-height: 1.6;
  }
  .info-box strong { color: var(--text2); }

  /* Toast-style why-it-matters */
  .why-box {
    background: rgba(245,158,11,0.07); border-left: 3px solid var(--amber);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    padding: 12px 14px; font-size: 13px; color: var(--text3); line-height: 1.6; margin-top: 12px;
  }

  /* Scroll fix for step screens */
  .scroll-screen { overflow-y: auto; }

  .tag { display: inline-flex; align-items: center; background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; color: var(--text3); margin: 2px; }

  /* Nav dots */
  .nav-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 20px; }
  .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border2); transition: var(--transition); }
  .nav-dot.done { background: var(--blue); }

  /* Final feedback */
  .feedback-block { border-left: 3px solid var(--blue); padding-left: 14px; margin-bottom: 16px; }

  @media (max-width: 600px) {
    .screen { padding: 16px; }
    .card { padding: 16px; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .btn-lg { padding: 14px 24px; font-size: 15px; }
  }
</style>
</head>

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[rand(0, arr.length - 1)]; }
function clamp(v, min=0, max=100) { return Math.max(min, Math.min(max, v)); }

function generateCompany() {
  const ind = pick(INDUSTRIES);
  const name = pick(COMPANY_NAMES);
  const revenue = rand(120, 2800);
  const factories = rand(2, 8);
  const warehouses = rand(4, 18);
  const suppliers = rand(18, 120);
  const inventoryDays = rand(14, 45);
  const leadTime = rand(21, 63);
  const countries = [];
  const pool = [...COUNTRIES];
  const n = rand(3, 6);
  for (let i = 0; i < n; i++) {
    const idx = rand(0, pool.length - 1);
    countries.push(pool.splice(idx, 1)[0]);
  }
  return { name, industry: ind, revenue, factories, warehouses, suppliers, inventoryDays, leadTime, countries };
}

function generateCrisis(company) {
  const template = pick(CRISES);
  const country = pick(company.countries);
  const material = pick(MATERIALS);
  const description = template.description
    .replace('{country}', country)
    .replace('{material}', material);
  return { ...template, description, country };
}

function generateInitialMetrics() {
  return {
    cost: rand(55, 80),
    inventory: rand(60, 85),
    profit: rand(50, 75),
    delivery: rand(60, 85),
    satisfaction: rand(65, 85),
  };
}

function NavDots({ current, total }) {

    <div className="nav-dots">

        <div key={i} className={`nav-dot ${i < current ? 'done' : ''}`} />

function ProgressBar({ label, value, color, showValue=true }) {
  const [display, setDisplay] = useState(0);
  useEffect(() => {
    const t = setTimeout(() => setDisplay(value), 100);
    return () => clearTimeout(t);
  }, [value]);
  return (
    <div className="progress-wrap">
      <div className="progress-label">
        <span style={{fontSize:13, color:'var(--text2)'}}>{label}</span>
        {showValue && <span className="mono" style={{fontSize:13, fontWeight:700, color}}>{display}%</span>}
      </div>
      <div className="progress-track">
        <div className="progress-fill" style={{width:`${display}%`, background:color}} />
      </div>
    </div>
  );
}

function WarRoomScreen({ metrics, setMetrics, onNext, selectedActions, setSelectedActions }) {
  const [confirmed, setConfirmed] = useState(false);
  const [newMetrics, setNewMetrics] = useState(null);

  const toggle = (id) => {
    if (confirmed) return;
    setSelectedActions(prev => {
      if (prev.includes(id)) return prev.filter(x => x !== id);
      if (prev.length >= 3) return prev;
      return [...prev, id];
    });
  };

  const confirm = () => {
    const updated = { ...metrics };
    selectedActions.forEach(id => {
      const a = ACTIONS.find(x => x.id === id);
      updated.cost = clamp(updated.cost + a.effects.cost);
      updated.inventory = clamp(updated.inventory + a.effects.inventory);
      updated.profit = clamp(updated.profit + a.effects.profit);
      updated.delivery = clamp(updated.delivery + a.effects.delivery);
      updated.satisfaction = clamp(updated.satisfaction + a.effects.satisfaction);
    });
    setNewMetrics(updated);
    setMetrics(updated);
    setConfirmed(true);
  };

  const metricColor = (v) => v >= 70 ? 'var(--emerald)' : v >= 45 ? 'var(--amber)' : 'var(--rose)';

        <div className="grid-2" style={{marginBottom:24}}>
          {ACTIONS.map(a => {
            const sel = selectedActions.includes(a.id);
            return (
              <div key={a.id} className={`action-card ${sel ? 'selected' : ''}`} onClick={() => toggle(a.id)}>
                <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
                  <span style={{fontSize:24}}>{a.icon}</span>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700, marginBottom:4}}>{a.title}</div>

                      {Object.entries(a.effects).map(([k,v]) => (
                        <span key={k} className={`badge ${v > 0 ? 'badge-emerald' : v < 0 ? 'badge-rose' : 'badge-cyan'}`} style={{fontSize:10}}>
                          {k} {v > 0 ? `+${v}` : v}%
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        <div style={{textAlign:'center', marginBottom:24}}>
          <div style={{color:'var(--text3)', fontSize:14, marginBottom:12}}>
            Selected: <strong style={{color: selectedActions.length===3?'var(--emerald)':'var(--text)'}}>{selectedActions.length} / 3</strong>
          </div>
          {!confirmed && (
            <button className="btn btn-amber btn-lg" disabled={selectedActions.length !== 3} onClick={confirm}>

function NegotiationScreen({ onNext, setNegoScore }) {
  const [round, setRound] = useState(0);
  const [trust, setTrust] = useState(50);
  const [price, setPrice] = useState(100);
  const [lead, setLead] = useState(42);
  const [chosen, setChosen] = useState(null);
  const [history, setHistory] = useState([]);
  const [totalScore, setTotalScore] = useState(0);
  const [done, setDone] = useState(false);

  const current = NEGO_ROUNDS[round];

  const choose = (idx) => {
    if (chosen !== null) return;
    const c = current.choices[idx];
    setChosen(idx);
    const newTrust = clamp(trust + c.trust, 0, 100);
    const newLead = Math.max(7, lead + c.lead);
    const pts = Math.round(((c.trust + 20) / 40) * 25);
    setTrust(newTrust);
    setPrice(p => Math.max(60, p + c.price));
    setLead(newLead);
    setTotalScore(s => s + pts);
    setHistory(h => [...h, { round: round+1, choice: c.label, trustDelta: c.trust, pts }]);
    setTimeout(() => {
      if (round + 1 < NEGO_ROUNDS.length) {
        setRound(r => r + 1);
        setChosen(null);
      } else {
        const finalScore = Math.round((newTrust / 100) * 60 + pts * 0.4);
        setNegoScore(Math.min(100, totalScore + pts));
        setDone(true);
      }
    }, 1400);
  };

  const trustColor = trust >= 60 ? 'var(--emerald)' : trust >= 40 ? 'var(--amber)' : 'var(--rose)';

function BoardroomScreen({ onNext, setBoardScore }) {

  const [done, setDone] = useState(false);
  const [answers, setAnswers] = useState([]);

  const current = CEO_QUESTIONS[qIndex];

    if (chosen !== null) return;
    const pts = current.choices[idx].score;
    setChosen(idx);
    setScore(s => s + pts);
    setAnswers(a => [...a, { q: current.q, chosen: idx, best: current.best, pts }]);
    setTimeout(() => {
      if (qIndex + 1 < CEO_QUESTIONS.length) {

            { icon:'👁️', title:'Visibility is your first line of defense', text:`You can't manage what you can't see. Real-time supplier monitoring, inventory visibility, and demand signals turn reactive firefighting into proactive risk management.` },
            { icon:'🤝', title:'Relationships compound', text:'Suppliers prioritize customers they trust. Investing in supplier relationships — paying on time, communicating early, sharing forecasts — means they answer your calls when everyone is scrambling.' },
            { icon:'📋', title:'Playbooks prevent panic', text:'The best-run supply chains have documented crisis playbooks. Roles, escalation paths, and decision trees remove confusion in the first 24 hours when time matters most.' },
          ].map((l,i) => (
            <div key={i} className="feedback-block" style={{marginBottom:16, borderColor: ['var(--blue)','var(--violet)','var(--emerald)','var(--amber)'][i]}}>
              <div style={{fontWeight:700, marginBottom:4}}>{l.icon} {l.title}</div>
              <p style={{fontSize:13, color:'var(--text3)', lineHeight:1.7}}>{l.text}</p>
            </div>
          ))}
        </div>

        <div style={{textAlign:'center'}}>
          <button className="btn btn-primary btn-lg" onClick={onReplay} style={{marginRight:12}}>
            🔄 Play Again with New Crisis
          </button>
          <p style={{marginTop:12, fontSize:12, color:'var(--muted)'}}>
            Every playthrough randomizes the company, crisis, and outcomes.
          </p>
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ───────────────────────────────────────────────────────────────

function App() {
  const [screen, setScreen] = useState('welcome');
  const [company, setCompany] = useState(null);
  const [crisis, setCrisis] = useState(null);
  const [metrics, setMetrics] = useState(null);
  const [selectedActions, setSelectedActions] = useState([]);
  const [negoScore, setNegoScore] = useState(0);
  const [boardScore, setBoardScore] = useState(0);
  const [aiChoices, setAiChoices] = useState([]);

  const startGame = () => {
    const c = generateCompany();
    const cr = generateCrisis(c);
    const m = generateInitialMetrics();
    setCompany(c);
    setCrisis(cr);
    setMetrics(m);
    setSelectedActions([]);
    setNegoScore(0);
    setBoardScore(0);
    setAiChoices([]);
    setScreen('company');
  };

  const go = (s) => setScreen(s);

  if (screen === 'welcome') return <WelcomeScreen onStart={startGame} />;
  if (screen === 'company') return <CompanyScreen company={company} crisis={crisis} onNext={() => go('crisis')} />;
  if (screen === 'crisis') return <CrisisScreen crisis={crisis} company={company} onNext={() => go('warroom')} />;
  if (screen === 'warroom') return (
    <WarRoomScreen
      metrics={metrics} setMetrics={setMetrics}
      selectedActions={selectedActions} setSelectedActions={setSelectedActions}
      onNext={() => go('negotiation')}
    />
  );
  if (screen === 'negotiation') return (
    <NegotiationScreen onNext={() => go('boardroom')} setNegoScore={setNegoScore} />
  );
  if (screen === 'boardroom') return (
    <BoardroomScreen onNext={() => go('ai')} setBoardScore={setBoardScore} />
  );
  if (screen === 'ai') return (
    <AIStrategyScreen onNext={() => go('final')} setAiChoices={setAiChoices} />
  );
  if (screen === 'final') return (
    <FinalDashboard
      data={{ company, crisis, metrics, selectedActions, negoScore, boardScore, aiChoices }}
      onReplay={startGame}
    />
  );
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
